schema_version = 1
kind = "script"
id = "labs.script-bash-read-functions"
target = "linux"
title = "Script (bash): read a file line by line and use a function"
summary = "while read, fields, a function, and a failing exit status."
lesson = "foundations.bash-control-flow"
symptom = '''
Write a bash script and save it as /home/labadmin/labs/disk-report.sh.

The file /home/labadmin/labdata/disks.txt has one line per disk in the form  name:size_gb:used_gb, for example:

    data1:500:120
    logs:50:47

For each line, print its status in this form, in file order:

    data1: ok (24%)
    logs: FULL (94%)

The percentage is used divided by size, as a whole number (integer division, rounded down). A disk is FULL when it is 90% or more used, otherwise ok.

After the last line, exit with status 1 if ANY disk was FULL, otherwise status 0. Print nothing else. Skip blank lines. The file changes every time your script is checked.
'''
hints = [
  "while IFS=: read -r name size used; do ... done < file reads a line and splits it on colons into three variables.",
  "$(( used * 100 / size )) does the integer arithmetic in the shell.",
  "A function keeps the rule in one place: percent() { echo $(( $2 * 100 / $1 )); } then pct=$(percent \"$size\" \"$used\").",
  "Remember whether any disk was full in a variable that you set inside the loop, and use it for the exit status after the loop.",
]
expected_changes = ["Creates /home/labadmin/labs with a starter script and a generated disks file"]
hazards = ["None: the script only reads a file"]
scope = "single guest (the registered Linux training VM only)"
privilege = "standard"
requires_snapshot = true
cleanup_strategy = "snapshot-restore"
certifications = ["comptia-linux-plus/scripting-containers-automation", "redhat-rhcsa/essential-tools"]
language = "bash"
script_path = '/home/labadmin/labs/disk-report.sh'
starter = '''
#!/bin/bash
# disk-report.sh
# For each "name:size_gb:used_gb" line in /home/labadmin/labdata/disks.txt print "<name>: ok (<pct>%)"
# or "<name>: FULL (<pct>%)" (FULL = 90% or more). Exit 1 if any disk was FULL, otherwise 0.
'''
solution = '''
#!/bin/bash
percent() { echo $(( $2 * 100 / $1 )); }
any_full=0
while IFS=: read -r name size used; do
    [ -z "$name" ] && continue
    pct=$(percent "$size" "$used")
    if [ "$pct" -ge 90 ]; then
        echo "$name: FULL ($pct%)"
        any_full=1
    else
        echo "$name: ok ($pct%)"
    fi
done < /home/labadmin/labdata/disks.txt
exit $any_full
'''

[[tests]]
setup = '''
d=/home/labadmin/labdata
rm -rf "$d"; mkdir -p "$d"
: > "$d/disks.txt"
for n in $(printf '%s\n' data1 data2 logs backup scratch | shuf -n $((RANDOM % 3 + 3))); do
  size=$((RANDOM % 900 + 100))
  used=$(( size * (RANDOM % 80 + 5) / 100 ))
  echo "$n:$size:$used" >> "$d/disks.txt"
done
'''
expect = '''
while IFS=: read -r n s u; do
  p=$(( u * 100 / s ))
  if [ "$p" -ge 90 ]; then echo "$n: FULL ($p%)"; else echo "$n: ok ($p%)"; fi
done < /home/labadmin/labdata/disks.txt
'''
expect_exit = 0

[[tests]]
setup = '''
d=/home/labadmin/labdata
rm -rf "$d"; mkdir -p "$d"
printf 'data1:500:120\n\nlogs:50:47\nbackup:1000:900\n' > "$d/disks.txt"
'''
expect = '''
echo "data1: ok (24%)"
echo "logs: FULL (94%)"
echo "backup: FULL (90%)"
'''
expect_exit = 1
