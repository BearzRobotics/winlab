schema_version = 1
id = "labs.linux-unit-exec-typo"
target = "linux"
title = "Linux: the heartbeat service says started, then fails"
summary = "A service's ExecStart points at a program that does not exist."
lesson = "linux.systemd"
symptom = "The winlab-heartbeat service used to write a line to its log every few seconds. After a change this morning the log has stopped growing. Someone ran 'systemctl restart winlab-heartbeat' and it printed nothing and returned without an error."
hints = [
  "A start that prints nothing does not prove the service is running. Ask for the state: systemctl status winlab-heartbeat.",
  "Look at the 'Main PID ... status=203/EXEC' line. 203/EXEC means systemd could not execute the program in ExecStart.",
  "journalctl -u winlab-heartbeat shows which file it could not find. Compare that path with what is really in /usr/local/bin.",
  "Fix the path in the unit (systemctl edit --full, or edit the file in /etc/systemd/system), run systemctl daemon-reload, then start the service and make sure it is enabled.",
]
expected_changes = [
  "Installs /usr/local/bin/winlab-heartbeat.sh and a unit winlab-heartbeat.service, enabled and running",
  "Then changes ExecStart to a file name with a typo and restarts it, so the unit ends in the failed state with 203/EXEC",
]
hazards = ["The heartbeat service in the lab VM stays failed until its ExecStart path is corrected"]
scope = "single guest (the registered Linux training VM only)"
privilege = "administrator"
requires_snapshot = true
cleanup_strategy = "snapshot-restore"
certifications = ["comptia-linux-plus/system-management", "comptia-linux-plus/troubleshooting", "redhat-rhcsa/running-systems"]
setup = '''
set -e
cat > /usr/local/bin/winlab-heartbeat.sh <<'SCRIPT'
#!/bin/sh
while :; do echo "beat $(date +%T)" >> /var/log/winlab-heartbeat.log; sleep 5; done
SCRIPT
chmod 755 /usr/local/bin/winlab-heartbeat.sh
cat > /etc/systemd/system/winlab-heartbeat.service <<'UNIT'
[Unit]
Description=WinLab heartbeat writer

[Service]
ExecStart=/usr/local/bin/winlab-heartbeat.sh

[Install]
WantedBy=multi-user.target
UNIT
systemctl daemon-reload
systemctl enable --now winlab-heartbeat
'''
fault = '''
sed -i 's#winlab-heartbeat.sh#winlab-heartbeet.sh#' /etc/systemd/system/winlab-heartbeat.service
systemctl daemon-reload
systemctl restart winlab-heartbeat || true
sleep 1
'''
solution = '''
sed -i 's#winlab-heartbeet.sh#winlab-heartbeat.sh#' /etc/systemd/system/winlab-heartbeat.service
systemctl daemon-reload
systemctl restart winlab-heartbeat
systemctl enable winlab-heartbeat
'''

[validate]
script = '''
sleep 1
echo "active=$(systemctl is-active winlab-heartbeat);enabled=$(systemctl is-enabled winlab-heartbeat)"
'''
expect_output_contains = "active=active;enabled=enabled"
