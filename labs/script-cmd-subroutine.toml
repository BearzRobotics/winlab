schema_version = 1
kind = "script"
id = "labs.script-cmd-subroutine"
title = "Script (CMD): a subroutine and a counted loop"
summary = "Use for /l, call and exit /b to structure a batch file."
lesson = "foundations.cmd-control-flow"
symptom = '''
Write a batch file and save it as C:\Labs\squares.cmd.

It is run with one whole number N as its argument, for example:

    squares.cmd 3

It must print one line for each number from 1 up to N, in this form:

    1 squared is 1
    2 squared is 4
    3 squared is 9

Print nothing else. For an argument of 0 it prints nothing at all.

Put the calculation and the printing of one line in a subroutine that you call once per number. (The check only looks at the output, but this is the structure the lesson teaches.)
'''
hints = [
  "for /l %%i in (1,1,%1) do ... counts from 1 to the argument in steps of 1.",
  "call :square %%i runs the label :square with %%i as its first argument (%1 inside the subroutine).",
  "In the subroutine, set /a result=%1*%1 does the arithmetic. Finish it with exit /b 0 so execution does not run into the next label.",
  "Put exit /b 0 after the loop, before the subroutine's label, so the main script ends there.",
]
expected_changes = ["Creates C:\\Labs with a starter batch file"]
hazards = ["None: the batch file only prints text"]
scope = "single guest (the registered training VM only)"
privilege = "standard"
requires_snapshot = true
cleanup_strategy = "snapshot-restore"
certifications = ["comptia-a-core2/operating-systems"]
language = "cmd"
script_path = 'C:\Labs\squares.cmd'
starter = '''
@echo off
rem squares.cmd N
rem Print "<i> squared is <i*i>" for i from 1 to N, using a subroutine called once per number
'''
solution = '''
@echo off
for /l %%i in (1,1,%1) do call :square %%i
exit /b 0

:square
set /a result=%1*%1
echo %1 squared is %result%
exit /b 0
'''

[[tests]]
setup = "$null = 1"
args = "3"
expect = '''
1..3 | ForEach-Object { "$_ squared is $($_ * $_)" }
'''
expect_exit = 0

[[tests]]
setup = "$null = 1"
args = "7"
expect = '''
1..7 | ForEach-Object { "$_ squared is $($_ * $_)" }
'''

[[tests]]
setup = "$null = 1"
args = "1"
expect = '''
"1 squared is 1"
'''

[[tests]]
setup = "$null = 1"
args = "0"
expect_exit = 0
check = '''
'OK'
'''
