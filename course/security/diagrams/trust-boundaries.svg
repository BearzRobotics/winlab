<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Trust boundaries in a home lab: between the internet and the home LAN, between the guest Wi-Fi and the LAN, between a VM and its host, and between a normal user and root" font-family="Segoe UI, sans-serif">
  <title>Where trust changes</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .dashed { fill: none; stroke: #c9731c; stroke-width: 1.5; stroke-dasharray: 6 4 }
    .wire { stroke: #c9731c; stroke-width: 1.5; stroke-dasharray: 6 4 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>

  <rect class="box" x="10" y="30" width="150" height="56" rx="6"/>
  <text class="bold" x="85" y="64" text-anchor="middle">internet</text>
  <rect class="box" x="10" y="140" width="150" height="56" rx="6"/>
  <text class="bold" x="85" y="174" text-anchor="middle">guest Wi-Fi</text>

  <line class="wire" x1="185" y1="16" x2="185" y2="232"/>

  <rect class="zone-user" x="210" y="30" width="500" height="202" rx="8"/>
  <text class="bold" x="460" y="52" text-anchor="middle">home LAN</text>
  <rect class="box" x="230" y="66" width="200" height="150" rx="6"/>
  <text class="bold" x="330" y="90" text-anchor="middle">VM host</text>
  <rect class="dashed" x="246" y="104" width="168" height="94" rx="6"/>
  <text x="330" y="130" text-anchor="middle">VM</text>
  <text class="dim" x="330" y="156" text-anchor="middle" font-size="13">VM / host boundary</text>

  <rect class="box" x="460" y="66" width="230" height="150" rx="6"/>
  <text class="bold" x="575" y="90" text-anchor="middle">a server</text>
  <text x="575" y="122" text-anchor="middle">normal user</text>
  <line class="wire" x1="476" y1="140" x2="674" y2="140"/>
  <text x="575" y="168" text-anchor="middle">root</text>
  <text class="dim" x="575" y="198" text-anchor="middle" font-size="13">user / root boundary</text>

  <text class="dim" x="10" y="262" font-size="13">Dashed lines are trust boundaries. Ask what could go wrong as data or commands cross each one.</text>
</svg>
