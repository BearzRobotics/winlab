<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="sshd reads the files in sshd_config.d in name order and keeps the first value it sees for each keyword, so 00-wl-weak.conf wins over 50-cloud-init.conf. sshd -T shows the result" font-family="Segoe UI, sans-serif">
  <title>sshd keeps the first value it reads</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="zone-kernel" x="20" y="30" width="420" height="52" rx="6"/>
  <text class="bold" x="230" y="52" text-anchor="middle">1. 00-wl-weak.conf</text>
  <text x="230" y="72" text-anchor="middle" font-size="13">PasswordAuthentication yes   (used)</text>
  <line class="wire" x1="230" y1="82" x2="230" y2="100" marker-end="url(#arrow)"/>
  <rect class="box" x="20" y="102" width="420" height="52" rx="6"/>
  <text class="bold" x="230" y="124" text-anchor="middle">2. 50-cloud-init.conf</text>
  <text x="230" y="144" text-anchor="middle" font-size="13">PasswordAuthentication no   (ignored)</text>
  <line class="wire" x1="230" y1="154" x2="230" y2="172" marker-end="url(#arrow)"/>
  <rect class="box" x="20" y="174" width="420" height="40" rx="6"/>
  <text x="230" y="199" text-anchor="middle">3. later files, then the rest of sshd_config</text>

  <line class="wire" x1="440" y1="56" x2="508" y2="110" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="510" y="90" width="200" height="68" rx="6"/>
  <text class="bold" x="610" y="116" text-anchor="middle">sshd -T</text>
  <text x="610" y="140" text-anchor="middle" font-size="13">shows what is in force</text>
  <text class="dim" x="20" y="244" font-size="13">The Include line near the top of sshd_config reads these files before what follows it.</text>
</svg>
