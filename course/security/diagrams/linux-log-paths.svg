<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="sshd and sudo messages go to the journal and to text logs written by rsyslog; failed and successful logins also go to btmp and wtmp; the kernel audit system records file changes through auditd" font-family="Segoe UI, sans-serif">
  <title>Where the lab machines recorded security events</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="zone-user" x="10" y="54" width="170" height="60" rx="6"/>
  <text class="bold" x="95" y="80" text-anchor="middle">sshd, sudo</text>
  <text x="95" y="102" text-anchor="middle" font-size="13">programs that log</text>
  <line class="wire" x1="180" y1="70" x2="286" y2="40" marker-end="url(#arrow)"/>
  <line class="wire" x1="180" y1="84" x2="286" y2="94" marker-end="url(#arrow)"/>
  <line class="wire" x1="180" y1="100" x2="286" y2="150" marker-end="url(#arrow)"/>

  <rect class="box" x="288" y="20" width="190" height="42" rx="5"/>
  <text x="383" y="46" text-anchor="middle">the journal</text>
  <rect class="box" x="288" y="76" width="190" height="42" rx="5"/>
  <text x="383" y="102" text-anchor="middle">auth.log or secure</text>
  <rect class="box" x="288" y="132" width="190" height="42" rx="5"/>
  <text x="383" y="158" text-anchor="middle">btmp and wtmp</text>
  <text class="dim" x="492" y="46" font-size="13">journalctl</text>
  <text class="dim" x="492" y="102" font-size="13">written by rsyslog</text>
  <text class="dim" x="492" y="158" font-size="13">lastb and last (sshd logins)</text>

  <rect class="zone-kernel" x="10" y="200" width="170" height="52" rx="6"/>
  <text class="bold" x="95" y="222" text-anchor="middle">the kernel</text>
  <text x="95" y="242" text-anchor="middle" font-size="13">watch rules</text>
  <line class="wire" x1="180" y1="226" x2="286" y2="226" marker-end="url(#arrow)"/>
  <rect class="box" x="288" y="204" width="190" height="44" rx="5"/>
  <text x="383" y="231" text-anchor="middle">auditd</text>
  <text class="dim" x="492" y="231" font-size="13">ausearch, aureport</text>
  <text class="dim" x="10" y="280" font-size="13">On the AlmaLinux image the journal was lost at reboot; the text log remained.</text>
</svg>
