<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Each check gives PASS, FAIL or REVIEW. A FAIL sets exit status 1; REVIEW lines are lists a person must judge; a check that cannot run is reported as FAIL" font-family="Segoe UI, sans-serif">
  <title>What the baseline script reports</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="80" width="170" height="60" rx="6"/>
  <text class="bold" x="95" y="106" text-anchor="middle">one check</text>
  <text x="95" y="128" text-anchor="middle" font-size="13">reads, changes nothing</text>
  <line class="wire" x1="180" y1="96" x2="248" y2="48" marker-end="url(#arrow)"/>
  <line class="wire" x1="180" y1="110" x2="248" y2="110" marker-end="url(#arrow)"/>
  <line class="wire" x1="180" y1="124" x2="248" y2="172" marker-end="url(#arrow)"/>

  <rect class="zone-user" x="250" y="24" width="130" height="46" rx="6"/>
  <text class="bold" x="315" y="53" text-anchor="middle">PASS</text>
  <rect class="zone-kernel" x="250" y="87" width="130" height="46" rx="6"/>
  <text class="bold" x="315" y="116" text-anchor="middle">FAIL</text>
  <rect class="box" x="250" y="150" width="130" height="46" rx="6"/>
  <text class="bold" x="315" y="179" text-anchor="middle">REVIEW</text>

  <text x="400" y="52">matches the rule</text>
  <text x="400" y="108">breaks the rule, or could not check;</text>
  <text x="400" y="128">the script exits 1</text>
  <text x="400" y="171">a list: only a person knows</text>
  <text x="400" y="191">whether each entry belongs</text>
  <text class="dim" x="10" y="214" font-size="13">The thresholds are this script's choices.</text>
</svg>
