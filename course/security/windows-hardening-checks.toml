schema_version = 1
id = "security.windows-hardening-checks"
title = "Windows hardening checks: a read-only baseline script, planted weaknesses, fixes and a real lockout"
summary = "Build and run a read-only PowerShell baseline check (firewall, SMB1 and signing, Remote Desktop and NLA, local administrators, Guest, password and lockout policy, Defender, UAC, patch age, plus review lists for listeners, Run keys, tasks and services) on Windows Server 2022, prove it notices nine planted weaknesses, fix the real findings (SMB signing, minimum password length, lockout threshold) and see a lockout in action (error 1326 then 1909, event 4740). One server, one day; the SMB1 positive case was not proven."
content = "windows-hardening-checks.md"
estimated_minutes = 75
level = 3
objectives = [
  "Explain what a baseline check is and why it must be shown to fail before it is trusted",
  "Run the baseline script and read PASS, FAIL and REVIEW lines",
  "Explain the fresh-server findings: SMB signing, minimum password length 0, lockout Never, and patch age",
  "Fix settings with Set-SmbServerConfiguration and net accounts and re-check",
  "Describe what an account lockout does: errors 1326 and 1909, event 4740, and the denial-of-service trade-off",
]
prerequisites = ["security.windows-logging-and-detection", "foundations.powershell-basics"]
privilege = "administrator"
certifications = ["comptia-a-core2/security", "microsoft-md-102/protect-devices"]
evaluation_criteria = [
  "Learner runs the baseline and distinguishes a setting finding from a missing update",
  "Learner plants a weakness and shows which line reports it",
  "Learner locks a lab account out and names the error code, the event and the unlock command",
]

