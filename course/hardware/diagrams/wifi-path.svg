<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Wi-Fi signal bars only describe the radio link to the access point. Beyond it the device still needs authentication, an address, a gateway, name resolution and a reachable service" font-family="Segoe UI, sans-serif">
  <title>What the Wi-Fi bars do and do not tell you</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="zone-user" x="10" y="50" width="190" height="62" rx="6"/>
  <text class="bold" x="105" y="76" text-anchor="middle">1. radio signal</text>
  <text x="105" y="98" text-anchor="middle" font-size="13">what the bars show</text>
  <line class="wire" x1="200" y1="81" x2="262" y2="81" marker-end="url(#arrow)"/>
  <rect class="box" x="264" y="50" width="190" height="62" rx="6"/>
  <text class="bold" x="359" y="76" text-anchor="middle">2. join the network</text>
  <text x="359" y="98" text-anchor="middle" font-size="13">password, certificate</text>
  <line class="wire" x1="454" y1="81" x2="516" y2="81" marker-end="url(#arrow)"/>
  <rect class="box" x="518" y="50" width="192" height="62" rx="6"/>
  <text class="bold" x="614" y="76" text-anchor="middle">3. get an address</text>
  <text x="614" y="98" text-anchor="middle" font-size="13">DHCP</text>
  <line class="wire" x1="614" y1="112" x2="614" y2="146" marker-end="url(#arrow)"/>
  <rect class="box" x="518" y="148" width="192" height="62" rx="6"/>
  <text class="bold" x="614" y="174" text-anchor="middle">4. reach the gateway</text>
  <text x="614" y="196" text-anchor="middle" font-size="13">the way out</text>
  <line class="wire" x1="518" y1="179" x2="456" y2="179" marker-end="url(#arrow)"/>
  <rect class="box" x="264" y="148" width="190" height="62" rx="6"/>
  <text class="bold" x="359" y="174" text-anchor="middle">5. resolve names</text>
  <text x="359" y="196" text-anchor="middle" font-size="13">DNS</text>
  <line class="wire" x1="264" y1="179" x2="202" y2="179" marker-end="url(#arrow)"/>
  <rect class="zone-kernel" x="10" y="148" width="190" height="62" rx="6"/>
  <text class="bold" x="105" y="174" text-anchor="middle">6. reach the service</text>
  <text x="105" y="196" text-anchor="middle" font-size="13">sign-in page? filter?</text>

  <text class="bold" x="10" y="26">Full bars only say step 1 is good.</text>
  <text class="dim" x="10" y="238" font-size="13">Find the first step that fails.</text>
</svg>
