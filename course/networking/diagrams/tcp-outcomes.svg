<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Three outcomes of a TCP connection attempt: the server accepts, the host sends a reset so the connection is refused, or nothing comes back so the client times out" font-family="Segoe UI, sans-serif">
  <title>What comes back after the first packet</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="bold" x="75" y="24" text-anchor="middle">client</text>
  <text class="bold" x="400" y="24" text-anchor="middle">server</text>
  <text class="bold" x="600" y="24" text-anchor="middle">result</text>

  <rect class="box" x="20" y="40" width="110" height="56" rx="5"/>
  <text x="75" y="74" text-anchor="middle">SYN</text>
  <line class="wire" x1="132" y1="56" x2="338" y2="56" marker-end="url(#arrow)"/>
  <line class="wire" x1="338" y1="82" x2="132" y2="82" marker-end="url(#arrow)"/>
  <text x="235" y="76" text-anchor="middle" font-size="13">SYN-ACK</text>
  <rect class="zone-user" x="340" y="40" width="120" height="56" rx="5"/>
  <text x="400" y="74" text-anchor="middle">listening</text>
  <rect class="zone-user" x="490" y="40" width="220" height="56" rx="5"/>
  <text class="bold" x="600" y="74" text-anchor="middle">connected</text>

  <rect class="box" x="20" y="116" width="110" height="56" rx="5"/>
  <text x="75" y="150" text-anchor="middle">SYN</text>
  <line class="wire" x1="132" y1="132" x2="338" y2="132" marker-end="url(#arrow)"/>
  <line class="wire" x1="338" y1="158" x2="132" y2="158" marker-end="url(#arrow)"/>
  <text x="235" y="152" text-anchor="middle" font-size="13">RST (reset)</text>
  <rect class="box" x="340" y="116" width="120" height="56" rx="5"/>
  <text x="400" y="150" text-anchor="middle">no listener</text>
  <rect class="zone-kernel" x="490" y="116" width="220" height="56" rx="5"/>
  <text class="bold" x="600" y="150" text-anchor="middle">refused</text>

  <rect class="box" x="20" y="192" width="110" height="56" rx="5"/>
  <text x="75" y="226" text-anchor="middle">SYN</text>
  <line class="wire" x1="132" y1="220" x2="250" y2="220"/>
  <text class="bold" x="266" y="226" text-anchor="middle">X</text>
  <rect class="box" x="340" y="192" width="120" height="56" rx="5"/>
  <text x="400" y="226" text-anchor="middle">silent</text>
  <rect class="zone-kernel" x="490" y="192" width="220" height="56" rx="5"/>
  <text class="bold" x="600" y="226" text-anchor="middle">timed out</text>
  <text class="dim" x="20" y="272" font-size="13">A firewall can also send a reset, or drop packets silently.</text>
</svg>
