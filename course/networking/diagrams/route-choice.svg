<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="To choose a route: keep the routes that contain the destination, take the longest prefix, and among equal prefixes take the lowest total metric; then send directly if on-link or to the gateway" font-family="Segoe UI, sans-serif">
  <title>How a route is chosen</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="bold" x="200" y="22" text-anchor="middle">a packet for 203.0.113.77</text>
  <line class="wire" x1="200" y1="30" x2="200" y2="46" marker-end="url(#arrow)"/>
  <rect class="box" x="30" y="48" width="340" height="42" rx="6"/>
  <text x="200" y="74" text-anchor="middle">1. which routes contain the address?</text>
  <line class="wire" x1="200" y1="90" x2="200" y2="108" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="30" y="110" width="340" height="42" rx="6"/>
  <text class="bold" x="200" y="136" text-anchor="middle">2. longest prefix wins</text>
  <line class="wire" x1="200" y1="152" x2="200" y2="170" marker-end="url(#arrow)"/>
  <rect class="box" x="30" y="172" width="340" height="42" rx="6"/>
  <text x="200" y="198" text-anchor="middle">3. tie: lowest total metric</text>

  <text x="410" y="70" font-size="13">/32 (metric 500)</text>
  <text x="410" y="92" font-size="13">/24 (metric 1)</text>
  <text x="410" y="114" font-size="13">/0, the default route</text>
  <rect class="zone-kernel" x="400" y="130" width="310" height="52" rx="6"/>
  <text class="bold" x="555" y="152" text-anchor="middle">the /32 is used</text>
  <text x="555" y="172" text-anchor="middle" font-size="13">although its metric is far worse</text>
  <text class="dim" x="30" y="244" font-size="13">Then: on-link, deliver straight to the address; otherwise send to the route's gateway.</text>
  <text class="dim" x="30" y="264" font-size="13">On Windows, total metric = route metric + interface metric.</text>
</svg>
