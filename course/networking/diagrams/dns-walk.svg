<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="The stub resolver asks a recursive resolver, which asks a root server, then a com server, then the example.com server, caches the answer and returns it" font-family="Segoe UI, sans-serif">
  <title>Looking up www.example.com with an empty cache</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="zone-user" x="10" y="110" width="150" height="66" rx="6"/>
  <text class="bold" x="85" y="138" text-anchor="middle">stub resolver</text>
  <text x="85" y="160" text-anchor="middle" font-size="13">your machine</text>
  <line class="wire" x1="160" y1="132" x2="228" y2="132" marker-end="url(#arrow)"/>
  <line class="wire" x1="228" y1="156" x2="162" y2="156" marker-end="url(#arrow)"/>
  <text x="195" y="122" text-anchor="middle" font-size="13">ask</text>
  <text x="195" y="176" text-anchor="middle" font-size="13">answer</text>
  <rect class="zone-kernel" x="230" y="100" width="180" height="86" rx="6"/>
  <text class="bold" x="320" y="130" text-anchor="middle">recursive resolver</text>
  <text x="320" y="154" text-anchor="middle" font-size="13">walks the tree</text>
  <text x="320" y="174" text-anchor="middle" font-size="13">and caches answers</text>

  <rect class="box" x="520" y="20" width="190" height="56" rx="6"/>
  <text class="bold" x="615" y="44" text-anchor="middle">1. a root server</text>
  <text x="615" y="64" text-anchor="middle" font-size="13">ask the com servers</text>
  <rect class="box" x="520" y="116" width="190" height="56" rx="6"/>
  <text class="bold" x="615" y="140" text-anchor="middle">2. a com server</text>
  <text x="615" y="160" text-anchor="middle" font-size="13">ask these name servers</text>
  <rect class="zone-user" x="520" y="212" width="190" height="56" rx="6"/>
  <text class="bold" x="615" y="236" text-anchor="middle">3. authoritative</text>
  <text x="615" y="256" text-anchor="middle" font-size="13">here is the address</text>

  <line class="wire" x1="410" y1="112" x2="518" y2="56" marker-end="url(#arrow)"/>
  <line class="wire" x1="410" y1="143" x2="518" y2="143" marker-end="url(#arrow)"/>
  <line class="wire" x1="410" y1="174" x2="518" y2="234" marker-end="url(#arrow)"/>
  <text class="dim" x="10" y="292" font-size="13">A cached answer is returned at once, until its TTL runs out.</text>
</svg>
