schema_version = 1
id = "networking.dns"
title = "DNS: how names become addresses"
summary = "The DNS hierarchy, resolvers, caching and TTL, the common record types, and how to query, read and troubleshoot name resolution with nslookup, Resolve-DnsName, resolvectl and getent."
content = "dns.md"
estimated_minutes = 55
level = 3
objectives = [
  "Explain what a stub resolver, a recursive resolver and an authoritative server each do",
  "Name the common record types (A, AAAA, CNAME, MX, NS, PTR, TXT, SOA) and what each holds",
  "Explain TTL, caching and negative caching, and why a change is not seen everywhere at once",
  "Query a specific server from the command line on Windows and Linux and read the answer",
  "Show, set and clear the DNS settings and the cache on Windows and Linux",
  "Separate a DNS fault from an address, route or port fault",
]
prerequisites = ["networking.addressing-and-names"]
windows_features = ["Command Prompt", "Windows PowerShell"]
privilege = "standard"
certifications = ["comptia-network-plus/networking-concepts", "comptia-network-plus/network-troubleshooting", "comptia-a-core1/networking", "redhat-rhcsa/basic-networking"]
evaluation_criteria = [
  "Learner queries the same name against two different servers and explains any difference in the answers",
  "Learner proves whether a failure is DNS by connecting to the address directly",
  "Learner explains why a hosts-file line overrides DNS and where each OS keeps that file",
]

