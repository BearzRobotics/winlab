schema_version = 1
id = "networking.ports-and-firewalls"
title = "Ports, services and host firewalls"
summary = "TCP and UDP ports, listening versus connecting, how to see what is listening and who owns it, how to tell refused from filtered, and how to read and change the Windows Defender Firewall and the Linux firewalld and ufw."
content = "ports-and-firewalls.md"
estimated_minutes = 60
objectives = [
  "Explain what a port is and the difference between TCP and UDP",
  "Name the well-known ports for common services and where the official list lives",
  "List listening ports and the process that owns each one, on Windows and Linux",
  "Tell connected, refused and timed-out apart and say what each implies",
  "Read the Windows firewall profiles and rules, and add or remove a rule from PowerShell and netsh",
  "Open a service port on firewalld and ufw, and explain runtime versus permanent rules",
]
prerequisites = ["networking.addressing-and-names"]
windows_features = ["Command Prompt", "Windows PowerShell", "Windows Defender Firewall"]
privilege = "administrator"
certifications = ["comptia-network-plus/networking-concepts", "comptia-network-plus/network-troubleshooting", "comptia-network-plus/network-security", "comptia-a-core1/networking", "redhat-rhcsa/basic-networking"]
evaluation_criteria = [
  "Learner distinguishes a refused connection from a timed-out one and states the likely cause of each",
  "Learner finds which process listens on a port and whether the firewall allows it in",
  "Learner opens a port on the host firewall, proves it from another machine, then removes the rule",
]

