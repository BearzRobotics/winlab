schema_version = 1
id = "networking.routing-and-gateways"
title = "Routing: how packets find their way"
summary = "How a host decides where to send a packet: the routing table, longest-prefix match, the default gateway, metrics, TTL and traceroute, with the Windows and Linux commands to read and change routes safely."
content = "routing-and-gateways.md"
estimated_minutes = 55
objectives = [
  "Explain what a router does and how a host chooses between on-link delivery and its gateway",
  "Read a routing table on Windows and Linux and pick the route a destination will use",
  "Apply longest-prefix match and metrics to decide between competing routes",
  "Explain what TTL does and how traceroute uses it",
  "Add and remove a static route on Windows and Linux, and know whether it survives a reboot",
  "Diagnose a wrong or missing gateway from a pattern of symptoms",
]
prerequisites = ["networking.subnetting", "networking.addressing-and-names"]
windows_features = ["Command Prompt", "Windows PowerShell"]
privilege = "standard"
certifications = ["comptia-network-plus/networking-concepts", "comptia-network-plus/network-troubleshooting", "comptia-a-core1/networking", "redhat-rhcsa/basic-networking"]
evaluation_criteria = [
  "Learner reads a pasted routing table and states which route and next hop a given destination uses",
  "Learner explains why a machine can reach its own subnet but nothing beyond it when the gateway is wrong",
  "Learner adds a temporary static route, proves it with a trace, and removes it",
]

