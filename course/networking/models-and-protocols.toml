schema_version = 1
id = "networking.models-and-protocols"
title = "How networks work: layers, protocols and ports"
summary = "The OSI and TCP/IP models, how data is wrapped on its way out, TCP versus UDP, the ports and protocols you meet daily, and how MAC addresses, ARP and switches fit in."
content = "models-and-protocols.md"
estimated_minutes = 50
level = 1
objectives = [
  "Name the layers of the OSI and TCP/IP models and place a protocol or device at its layer",
  "Describe encapsulation and name the unit of data at each layer",
  "Explain the TCP three-way handshake and when an application uses UDP instead",
  "Match common services to their well-known ports and transport protocol",
  "Explain how ARP, MAC addresses, switches and routers work together on one local network",
]
prerequisites = ["foundations.troubleshooting-method"]
windows_features = ["Command Prompt", "Windows PowerShell"]
privilege = "standard"
certifications = ["comptia-network-plus/networking-concepts", "comptia-a-core1/networking", "comptia-linux-plus/troubleshooting"]
evaluation_criteria = [
  "Learner places ten given protocols and devices at the correct layer",
  "Learner reads a connection list and says which service each listening port belongs to",
  "Learner explains why a ping can succeed while a web page does not load",
]

