schema_version = 1
id = "networking.addressing-and-names"
title = "Networking basics: addresses, names and ports"
summary = "The overview of the networking track: a layered model and a bottom-up routine that tells no address, wrong gateway, wrong DNS and blocked port apart, using built-in tools on Windows and Linux."
content = "addressing-and-names.md"
estimated_minutes = 45
objectives = [
  "Read an IPv4 address and prefix and say whether two hosts share a network",
  "Explain what DHCP, a default gateway and DNS each do",
  "Tell a link, address, name or port problem apart using built-in tools",
  "Explain the difference between a refused and a timed-out connection",
]
prerequisites = ["foundations.troubleshooting-method"]
windows_features = ["Command Prompt", "Windows PowerShell"]
privilege = "standard"
certifications = ["comptia-network-plus/networking-concepts", "comptia-network-plus/network-troubleshooting", "comptia-a-core1/networking", "comptia-linux-plus/troubleshooting"]
evaluation_criteria = [
  "Learner works through the bottom-up routine on a lab VM and records the first failing step",
  "Learner explains why an APIPA address (169.254.x.x) appears",
]

