schema_version = 1
id = "endpoints.protect-devices"
title = "Protecting Windows devices: firewall, Defender, encryption"
summary = "Check and restore the firewall and malware protection, understand BitLocker and device compliance, with built-in tools."
content = "protect-devices.md"
estimated_minutes = 70
level = 3
objectives = [
  "Read and restore Windows Defender Firewall profile state",
  "Check Microsoft Defender Antivirus status and update signatures",
  "Explain BitLocker, recovery keys and the role of a TPM",
  "Explain what device compliance checks and how to verify them by hand",
]
prerequisites = ["foundations.powershell-basics"]
windows_features = ["Windows Defender Firewall", "Windows Security", "BitLocker"]
privilege = "administrator"
certifications = ["microsoft-md-102/protect-devices", "comptia-a-core2/security", "comptia-network-plus/network-security"]
evaluation_criteria = [
  "Learner re-enables the firewall on all profiles in the lab and shows the verifying command",
  "Learner explains why a BitLocker recovery key must be stored before it is needed",
]

