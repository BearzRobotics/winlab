<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Local Group Policy, domain Group Policy, MDM and direct writes all end up as registry values that Windows reads; gpresult reports only Group Policy" font-family="Segoe UI, sans-serif">
  <title>Several writers, one registry</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="zone-user" x="10" y="30" width="165" height="50" rx="6"/>
  <text x="92" y="60" text-anchor="middle">Local Group Policy</text>
  <rect class="zone-user" x="188" y="30" width="165" height="50" rx="6"/>
  <text x="270" y="60" text-anchor="middle">Domain GPOs</text>
  <rect class="box" x="366" y="30" width="165" height="50" rx="6"/>
  <text x="448" y="60" text-anchor="middle">MDM / Intune</text>
  <rect class="box" x="544" y="30" width="166" height="50" rx="6"/>
  <text x="627" y="60" text-anchor="middle">script or person</text>

  <line class="wire" x1="92" y1="80" x2="280" y2="136" marker-end="url(#arrow)"/>
  <line class="wire" x1="270" y1="80" x2="320" y2="136" marker-end="url(#arrow)"/>
  <line class="wire" x1="448" y1="80" x2="400" y2="136" marker-end="url(#arrow)"/>
  <line class="wire" x1="627" y1="80" x2="440" y2="136" marker-end="url(#arrow)"/>

  <rect class="zone-kernel" x="190" y="138" width="340" height="56" rx="6"/>
  <text class="bold" x="360" y="162" text-anchor="middle">registry values</text>
  <text x="360" y="184" text-anchor="middle" font-size="13">...\SOFTWARE\Policies and a few others</text>
  <line class="wire" x1="360" y1="194" x2="360" y2="218" marker-end="url(#arrow)"/>
  <text class="bold" x="360" y="236" text-anchor="middle">Windows and programs read them</text>
  <text class="dim" x="10" y="262" font-size="13">gpresult reports Group Policy (the blue boxes). It did not report a value written directly.</text>
</svg>
