schema_version = 1
id = "windows-admin.registry-and-filesystems"
title = "The Windows registry, startup locations and file systems"
summary = "Hives, keys and values, safe registry editing, where programs start from, NTFS versus other file systems, and finding what fills a disk."
content = "registry-and-filesystems.md"
estimated_minutes = 120
level = 3
objectives = [
  "Name the registry hives and the types of value",
  "Read values with their types, change them safely with PowerShell, and avoid the traps that destroy or silently change settings",
  "Export a key before changing it and say what an import will not undo",
  "Find what starts a program, and say what a single listing misses",
  "Compare NTFS, ReFS, FAT32 and exFAT",
  "Find what is using disk space, read the results critically and explain why a full system drive causes odd failures",
  "Tell junctions, symbolic links and hard links apart and delete around them carefully",
]
prerequisites = ["foundations.powershell-basics"]
windows_features = ["Registry Editor", "Disk Management", "File Explorer"]
privilege = "administrator"
certifications = ["comptia-a-core2/operating-systems", "comptia-a-core2/software-troubleshooting", "microsoft-md-102/manage-maintain-devices"]
evaluation_criteria = [
  "Learner exports a key, changes one value and restores it from the export",
  "Learner finds the ten largest files on a volume and says what they would check before deleting any",
]

