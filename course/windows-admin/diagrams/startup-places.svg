<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="What starts at boot and what starts when a user signs in" font-family="Segoe UI, sans-serif">
  <title>Where programs start from</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="hardware" x="10" y="10" width="170" height="40" rx="5"/>
  <text class="bold" x="95" y="35" text-anchor="middle">the PC boots</text>
  <line class="wire" x1="180" y1="30" x2="448" y2="30" marker-end="url(#arrow)"/>
  <rect class="hardware" x="450" y="10" width="260" height="40" rx="5"/>
  <text class="bold" x="580" y="35" text-anchor="middle">someone signs in</text>

  <rect class="zone-kernel" x="10" y="72" width="340" height="170" rx="8"/>
  <text class="bold" x="180" y="98" text-anchor="middle">at boot: no one needed</text>
  <rect class="box" x="30" y="112" width="300" height="50" rx="5"/>
  <text x="180" y="132" text-anchor="middle">services set to Automatic</text>
  <text class="dim" x="180" y="152" text-anchor="middle" font-size="13">(and drivers)</text>
  <rect class="box" x="30" y="176" width="300" height="50" rx="5"/>
  <text x="180" y="196" text-anchor="middle">scheduled tasks</text>
  <text class="dim" x="180" y="216" text-anchor="middle" font-size="13">with a startup trigger</text>

  <rect class="zone-user" x="370" y="72" width="340" height="218" rx="8"/>
  <text class="bold" x="540" y="98" text-anchor="middle">at sign-in</text>
  <rect class="box" x="390" y="112" width="300" height="36" rx="5"/>
  <text x="540" y="135" text-anchor="middle">Run and RunOnce keys (HKLM, HKCU)</text>
  <rect class="box" x="390" y="156" width="300" height="36" rx="5"/>
  <text x="540" y="179" text-anchor="middle">two Startup folders</text>
  <rect class="box" x="390" y="200" width="300" height="36" rx="5"/>
  <text x="540" y="223" text-anchor="middle">scheduled tasks with a logon trigger</text>
  <rect class="box" x="390" y="244" width="300" height="36" rx="5"/>
  <text x="540" y="267" text-anchor="middle">and other places this lesson omits</text>
</svg>
