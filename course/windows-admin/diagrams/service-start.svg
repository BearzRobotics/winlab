<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Starting a service: the start type must allow it, dependencies must start, the account must sign in, the program must be found, and it must answer the Service Control Manager in time. Each step has its own error code" font-family="Segoe UI, sans-serif">
  <title>What has to succeed for a service to start</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="bold" x="10" y="24">the step</text>
  <text class="bold" x="500" y="24">error when it fails (from the tests)</text>

  <rect class="box" x="10" y="36" width="300" height="34" rx="5"/>
  <text x="160" y="58" text-anchor="middle">1. start type allows it</text>
  <rect class="zone-kernel" x="500" y="36" width="210" height="34" rx="5"/>
  <text x="605" y="58" text-anchor="middle">1058 disabled</text>

  <rect class="box" x="10" y="80" width="300" height="34" rx="5"/>
  <text x="160" y="102" text-anchor="middle">2. its dependencies start</text>
  <rect class="zone-kernel" x="500" y="80" width="210" height="34" rx="5"/>
  <text x="605" y="102" text-anchor="middle">1068, event 7001</text>

  <rect class="box" x="10" y="124" width="300" height="34" rx="5"/>
  <text x="160" y="146" text-anchor="middle">3. its account signs in</text>
  <rect class="zone-kernel" x="500" y="124" width="210" height="34" rx="5"/>
  <text x="605" y="146" text-anchor="middle">1069, event 7038</text>

  <rect class="box" x="10" y="168" width="300" height="34" rx="5"/>
  <text x="160" y="190" text-anchor="middle">4. the program is found</text>
  <rect class="zone-kernel" x="500" y="168" width="210" height="34" rx="5"/>
  <text x="605" y="190" text-anchor="middle">2, event 7000</text>

  <rect class="box" x="10" y="212" width="300" height="34" rx="5"/>
  <text x="160" y="234" text-anchor="middle">5. it answers the SCM in time</text>
  <rect class="zone-kernel" x="500" y="212" width="210" height="34" rx="5"/>
  <text x="605" y="234" text-anchor="middle">1053, event 7009</text>

  <line class="wire" x1="310" y1="53" x2="498" y2="53" marker-end="url(#arrow)"/>
  <line class="wire" x1="310" y1="97" x2="498" y2="97" marker-end="url(#arrow)"/>
  <line class="wire" x1="310" y1="141" x2="498" y2="141" marker-end="url(#arrow)"/>
  <line class="wire" x1="310" y1="185" x2="498" y2="185" marker-end="url(#arrow)"/>
  <line class="wire" x1="310" y1="229" x2="498" y2="229" marker-end="url(#arrow)"/>
  <text class="dim" x="10" y="264" font-size="13">The order shows the questions to ask, not a documented internal sequence.</text>
</svg>
