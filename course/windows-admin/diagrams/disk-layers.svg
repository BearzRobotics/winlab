<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="A disk is divided into partitions; a volume with a file system holds folders and files" font-family="Segoe UI, sans-serif">
  <title>Disk, partition, volume, file system</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="bold" x="10" y="26">DISK</text>
  <text class="dim" x="80" y="26" font-size="13">Get-Disk</text>
  <rect class="hardware" x="10" y="36" width="700" height="56" rx="6"/>
  <rect class="box" x="18" y="44" width="110" height="40" rx="4"/>
  <text x="73" y="69" text-anchor="middle">System</text>
  <rect class="box" x="136" y="44" width="90" height="40" rx="4"/>
  <text x="181" y="69" text-anchor="middle">Reserved</text>
  <rect class="zone-user" x="234" y="44" width="348" height="40" rx="4"/>
  <text class="bold" x="408" y="69" text-anchor="middle">Basic</text>
  <rect class="box" x="590" y="44" width="112" height="40" rx="4"/>
  <text x="646" y="69" text-anchor="middle">others</text>
  <text class="bold" x="10" y="116">PARTITIONS</text>
  <text class="dim" x="120" y="116" font-size="13">Get-Partition</text>

  <line class="wire" x1="408" y1="84" x2="408" y2="136" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="234" y="136" width="348" height="52" rx="6"/>
  <text class="bold" x="408" y="158" text-anchor="middle">VOLUME C:  formatted NTFS</text>
  <text class="dim" x="408" y="178" text-anchor="middle" font-size="13">Get-Volume: file system, health, free space</text>

  <line class="wire" x1="408" y1="188" x2="408" y2="212" marker-end="url(#arrow)"/>
  <rect class="box" x="234" y="212" width="348" height="44" rx="6"/>
  <text x="408" y="239" text-anchor="middle">folders and files, with their permissions</text>
</svg>
