schema_version = 1
id = "windows-admin.accounts-and-permissions"
title = "Windows accounts, groups and NTFS permissions"
summary = "Manage local users and groups from PowerShell and the command line, understand the access token and UAC, read and repair NTFS permissions with icacls, and see how share and NTFS permissions combine."
content = "accounts-and-permissions.md"
estimated_minutes = 75
level = 2
objectives = [
  "Create, disable, enable, rename and remove local accounts with PowerShell and net user",
  "Manage group membership and name the common built-in groups and their purpose",
  "List the common reasons a user cannot sign in, in a sensible order of checking",
  "Explain what an access token holds, why group changes need a new sign-in, and how UAC's two tokens show in whoami /groups",
  "Read and change an NTFS ACL with icacls: rights, inheritance flags, grant, grant:r, deny, inheritance, reset, save and restore",
  "Take ownership of a tree when no one has access, and grant access afterwards",
  "Explain how share permissions and NTFS permissions combine, and design them so there is one place to manage access",
  "Follow a procedure to diagnose an access-denied problem and test it as the affected user",
]
prerequisites = ["foundations.powershell-basics", "foundations.architecture"]
windows_features = ["Local Users and Groups", "File Explorer", "Windows PowerShell", "Command Prompt"]
privilege = "administrator"
certifications = ["comptia-a-core2/security", "comptia-a-core2/operating-systems", "microsoft-md-102/manage-maintain-devices"]
evaluation_criteria = [
  "Learner restores access to a folder by correcting the right group entry, not Everyone",
  "Learner explains why a new group membership does not apply until the next sign-in",
  "Learner reads an icacls entry and states who, which right and how it is inherited",
  "Learner saves permissions before a bulk change and can restore them",
]

