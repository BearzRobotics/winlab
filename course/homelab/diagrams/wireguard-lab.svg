<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Two network namespaces joined by a virtual cable that stands in for the internet, with an encrypted WireGuard tunnel between their wg interfaces running over it" font-family="Segoe UI, sans-serif">
  <title>The WireGuard lab: a tunnel over a plain link</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="20" width="230" height="170" rx="8"/>
  <text class="bold" x="125" y="44" text-anchor="middle">namespace wlpeer</text>
  <rect class="zone-user" x="30" y="58" width="190" height="52" rx="5"/>
  <text class="bold" x="125" y="80" text-anchor="middle">wg-peer</text>
  <text x="125" y="100" text-anchor="middle" font-size="13">10.8.0.2</text>
  <rect class="zone-kernel" x="30" y="124" width="190" height="52" rx="5"/>
  <text class="bold" x="125" y="146" text-anchor="middle">wlv-peer</text>
  <text x="125" y="166" text-anchor="middle" font-size="13">10.99.0.2</text>

  <rect class="box" x="480" y="20" width="230" height="170" rx="8"/>
  <text class="bold" x="595" y="44" text-anchor="middle">namespace wlhub</text>
  <rect class="zone-user" x="500" y="58" width="190" height="52" rx="5"/>
  <text class="bold" x="595" y="80" text-anchor="middle">wg-hub</text>
  <text x="595" y="100" text-anchor="middle" font-size="13">10.8.0.1</text>
  <rect class="zone-kernel" x="500" y="124" width="190" height="52" rx="5"/>
  <text class="bold" x="595" y="146" text-anchor="middle">wlv-hub</text>
  <text x="595" y="166" text-anchor="middle" font-size="13">10.99.0.1, UDP 51820</text>

  <line class="wire" x1="220" y1="84" x2="498" y2="84" marker-end="url(#arrow)"/>
  <text class="bold" x="360" y="74" text-anchor="middle">encrypted tunnel</text>
  <line class="wire" x1="220" y1="150" x2="498" y2="150" marker-end="url(#arrow)"/>
  <text x="360" y="140" text-anchor="middle">veth pair</text>
  <text class="dim" x="360" y="170" text-anchor="middle" font-size="13">stands in for the internet</text>
  <text class="dim" x="10" y="222" font-size="13">The tunnel's packets travel inside ordinary UDP packets on the plain link.</text>
</svg>
