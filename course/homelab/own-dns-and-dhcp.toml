schema_version = 1
id = "homelab.own-dns-and-dhcp"
title = "Your own DNS and DHCP server with dnsmasq"
summary = "dnsmasq 2.91 (Ubuntu 24.04) and 2.85 (AlmaLinux 9.8): a lab zone on loopback (address, host-record, cname, local, blocking, cache with 17 ms then 0 ms), the Ubuntu port-53 clash with systemd-resolved, the dnsmasq --test trap on Ubuntu, and DHCP tested in a network namespace with a static lease. Includes the mistake where dhclient inside a namespace rewrote the host's /etc/resolv.conf and broke dnf, and the /etc/netns/NAME/resolv.conf fix."
content = "own-dns-and-dhcp.md"
estimated_minutes = 75
level = 3
objectives = [
  "Explain what a resolver, a forwarder and a cache do, and what DHCP hands out (the DORA exchange)",
  "Install dnsmasq and bind only named addresses so it coexists with systemd-resolved on Ubuntu",
  "Define lab names with address, host-record and cname, keep private names private with local=, and block a name",
  "Prove caching with dig query times and the log, and check configuration correctly with dnsmasq --test --conf-dir",
  "Test DHCP safely in a network namespace with a veth pair, a pool and a static lease, and protect the host's resolv.conf with /etc/netns/NAME/",
]
prerequisites = ["networking.dns", "networking.dhcp", "linux.systemd"]
privilege = "administrator"
certifications = ["comptia-network-plus/network-implementation", "comptia-linux-plus/system-management", "redhat-rhcsa/basic-networking"]
evaluation_criteria = [
  "Learner defines two lab names, shows which has a reverse record, and shows a cached answer",
  "Learner runs a DHCP test in a namespace and shows the lease and the name it created",
  "Learner explains why the host's resolv.conf must be protected when a DHCP client runs in a namespace",
]

[[references]]
title = "dnsmasq manual page"
url = "https://thekelleys.org.uk/dnsmasq/docs/dnsmasq-man.html"

[[references]]
title = "ip-netns(8)"
url = "https://man7.org/linux/man-pages/man8/ip-netns.8.html"

[[references]]
title = "systemd-resolved.service(8)"
url = "https://www.freedesktop.org/software/systemd/man/latest/systemd-resolved.service.html"

