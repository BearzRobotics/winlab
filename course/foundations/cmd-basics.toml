schema_version = 1
id = "foundations.cmd-basics"
title = "Command Prompt fundamentals"
summary = "How cmd reads and runs a line, finding programs (PATH and PATHEXT), special characters and escaping, files and folders from the GUI and the shell, redirection and pipes, exit codes, and the limits that make batch files tricky."
content = "cmd-basics.md"
estimated_minutes = 75
objectives = [
  "Open Command Prompt by several routes and navigate the file system with cd (including /d) and dir",
  "Explain the order in which cmd decides what a command name means, using PATH and PATHEXT, and find a program with where",
  "Use the special characters & && || | < > ( ) ^ and escape them correctly",
  "Quote paths that contain spaces, and know that cd is the lenient exception",
  "Create, copy, move, rename, delete and inspect files and folders from the shell, and say what each GUI action maps to",
  "Redirect stdout and stderr to files and to each other, and explain why the order matters",
  "Read a command's exit code from ERRORLEVEL and combine commands with && and ||",
  "Write and run a minimal batch file, and name the limits of cmd (line length, code page, no real data types)",
]
prerequisites = ["foundations.architecture"]
windows_features = ["Command Prompt", "File Explorer", "Windows Terminal"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner writes a command that saves a directory listing to a file in a scratch folder, and shows the file",
  "Learner shows a command that succeeds and one that fails, with the exit code of each",
  "Learner explains the difference between cmd > f 2>&1 and cmd 2>&1 > f by running both",
  "Learner uses where to explain which program runs for a name",
]

