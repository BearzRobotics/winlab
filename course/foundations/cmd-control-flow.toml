schema_version = 1
id = "foundations.cmd-control-flow"
title = "CMD batch files: decisions, loops, subroutines and errors"
summary = "if in every form and its comparison rules, all the for loops including for /f parsing options, labels, goto, call and subroutines that return values, exit codes, && and ||, and an error-handling pattern."
content = "cmd-control-flow.md"
estimated_minutes = 90
objectives = [
  "Write if conditions with text, numbers, files, variables and exit codes, and explain why text and numeric comparison differ",
  "Use if/else correctly, and express AND and OR where cmd has no operators for them",
  "Use every for form: plain sets, /l counted loops, /d and /r for folders and trees, and /f with tokens, delims, skip, eol and usebackq",
  "Predict what for /f skips: blank lines, the default eol, and leading delimiters",
  "Structure a batch file with labels, goto, call and subroutines, and return a result by name",
  "Explain why another batch file must be started with call",
  "Check outcomes with errorlevel, && and ||, and avoid treating a && b || c as if/else",
  "Handle errors with distinct exit codes and avoid pause and timeout in unattended scripts",
]
prerequisites = ["foundations.cmd-variables-and-expansion"]
windows_features = ["Command Prompt"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner writes a batch file that loops over a folder and keeps a running total",
  "Learner explains why a for /f over a file returned fewer lines than the file holds",
  "Learner writes a subroutine that returns a value in a caller-named variable",
  "Learner chooses distinct exit codes for distinct failures and tests them",
]

