schema_version = 1
id = "foundations.python-basics"
title = "Python basics for administrators"
summary = "Which Python you are running, running scripts on Windows and Linux, how Python executes a file, indentation, types, strings and paths, lists and dictionaries, tracebacks, exit statuses, and how to check a script before you run it."
content = "python-basics.md"
estimated_minutes = 150
level = 1
objectives = [
  "Decide when Python suits a job better than PowerShell or bash",
  "Find which interpreter and version a command runs, on Windows and Linux",
  "Run a script with arguments, and avoid the quoting, shebang and line-ending traps",
  "Explain why a syntax error runs nothing but other errors stop a script partway",
  "Work with numbers, text, paths, lists and dictionaries, and avoid their common traps",
  "Read a traceback from the bottom up",
  "Return a truthful exit status",
  "Check someone else's script before running it, including the import-shadowing trap and isolated mode",
]
prerequisites = []
privilege = "standard"
evaluation_criteria = [
  "Learner reports the path and version of the interpreter that a script actually uses",
  "Learner takes a traceback and names the error, the failing line and the likely cause",
  "Learner's script returns different exit statuses for success, a found problem and bad arguments",
  "Learner finds the faults in the delete script from the practice section without running it",
]

