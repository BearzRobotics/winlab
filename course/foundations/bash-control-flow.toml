schema_version = 1
id = "foundations.bash-control-flow"
title = "Bash decisions and loops: tests, [[ ]], case, loops and reading input"
summary = "How if tests a command's status, the quirks of [ ] and file tests, what [[ ]] fixes (patterns, regex with BASH_REMATCH, no splitting), (( )) and its inverted status, case with fall-through, every loop form with its traps (empty globs, last line without a newline, stdin theft, pipeline subshells), read with timeouts, retry loops, and the portable subset in dash and busybox ash."
content = "bash-control-flow.md"
estimated_minutes = 120
level = 2
objectives = [
  "Explain that if runs a command and tests its exit status, and use !, &&, : and the status of pipelines correctly",
  "Write robust [ ] tests: quote variables, use = for strings and -eq for integers, avoid unescaped > and -a/-o, and read the common error messages",
  "Use file tests (-e -f -d -L -r -w -x -s -nt -ot -ef) and explain why -e and -L differ on a broken link and why test-then-use is racy",
  "Use [[ ]] for pattern matching, regular expressions with BASH_REMATCH, string comparison and -v, and avoid the quoting and arithmetic-evaluation traps",
  "Use (( )) for integer logic and explain its inverted status, octal and no-floats rules",
  "Group commands with { } and ( ), write the die idiom, and state the main exceptions where set -e does not stop a script",
  "Write case statements with glob patterns, quoting rules, fall-through (;& and ;;&), nocasematch and extglob",
  "Write for, while, until, break N and continue N loops safely: guard empty globs, never loop over ls output, bound retries",
  "Read input line by line without losing the last line, trimming data or letting an inner command steal stdin, and avoid the pipeline-subshell trap",
  "Use read -t, -n, REPLY and select, and say which constructs are portable to dash and busybox ash",
]
prerequisites = ["foundations.bash-variables-and-expansion"]
windows_features = []
privilege = "standard"
certifications = ["redhat-rhcsa/essential-tools", "comptia-linux-plus/scripting-containers-automation"]
evaluation_criteria = [
  "Learner writes a script that reads a file line by line and counts items by category, keeping the last line and surviving spaces",
  "Learner explains what for f in $(ls) gets wrong and writes the safe loop with an empty-glob guard",
  "Learner reproduces [ 9 > 10 ] creating a file and fixes it",
  "Learner shows an inner cat stealing a loop's stdin and fixes it",
  "Learner finds every problem in the exercise-11 script",
]

