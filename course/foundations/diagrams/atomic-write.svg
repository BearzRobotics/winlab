<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Atomic write: create a temporary file in the same folder with mktemp, write all the new content into it, then rename it over the target with mv. Until the rename the target still holds the old content" font-family="Segoe UI, sans-serif">
  <title>Replace a file without showing half of it</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .mono { font-family: Consolas, monospace }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="zone-kernel" x="10" y="30" width="200" height="66" rx="6"/>
  <text class="bold" x="110" y="56" text-anchor="middle">1. mktemp</text>
  <text x="110" y="80" text-anchor="middle" font-size="13">in the SAME folder</text>
  <line class="wire" x1="210" y1="63" x2="258" y2="63" marker-end="url(#arrow)"/>
  <rect class="zone-kernel" x="260" y="30" width="200" height="66" rx="6"/>
  <text class="bold" x="360" y="56" text-anchor="middle">2. write it all</text>
  <text x="360" y="80" text-anchor="middle" font-size="13">into the temp file</text>
  <line class="wire" x1="460" y1="63" x2="508" y2="63" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="510" y="30" width="200" height="66" rx="6"/>
  <text class="bold mono" x="610" y="56" text-anchor="middle">3. mv -f</text>
  <text x="610" y="80" text-anchor="middle" font-size="13">rename over the target</text>

  <rect class="box" x="10" y="128" width="450" height="46" rx="5"/>
  <text x="235" y="156" text-anchor="middle">during 1 and 2 the target has the OLD content</text>
  <rect class="box" x="510" y="128" width="200" height="46" rx="5"/>
  <text x="610" y="156" text-anchor="middle">then the NEW content</text>

  <text class="dim" x="10" y="212" font-size="13">Writing straight onto the target (cp or &gt;) can leave a half-written file.</text>
</svg>
