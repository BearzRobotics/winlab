<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Three behaviours: non-terminating errors continue, statement-terminating errors can be caught but let the script go on, script-terminating errors stop it" font-family="Segoe UI, sans-serif">
  <title>What happens to a script after an error</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>

  <text class="bold" x="130" y="24" text-anchor="middle">the error</text>
  <text class="bold" x="420" y="24" text-anchor="middle">try/catch sees it?</text>
  <text class="bold" x="620" y="24" text-anchor="middle">without try</text>

  <rect class="box" x="10" y="40" width="250" height="62" rx="5"/>
  <text class="bold" x="135" y="64" text-anchor="middle">non-terminating</text>
  <text x="135" y="86" text-anchor="middle" font-size="13">most cmdlet errors</text>
  <rect class="zone-kernel" x="340" y="40" width="160" height="62" rx="5"/>
  <text class="bold" x="420" y="76" text-anchor="middle">NO</text>
  <rect class="zone-kernel" x="530" y="40" width="180" height="62" rx="5"/>
  <text x="620" y="76" text-anchor="middle">carries on</text>

  <rect class="box" x="10" y="116" width="250" height="62" rx="5"/>
  <text class="bold" x="135" y="140" text-anchor="middle">statement-terminating</text>
  <text x="135" y="162" text-anchor="middle" font-size="13">[int]'abc', 1/0, .NET, unknown name</text>
  <rect class="zone-user" x="340" y="116" width="160" height="62" rx="5"/>
  <text class="bold" x="420" y="152" text-anchor="middle">yes</text>
  <rect class="zone-kernel" x="530" y="116" width="180" height="62" rx="5"/>
  <text class="bold" x="620" y="152" text-anchor="middle">STILL carries on</text>

  <rect class="box" x="10" y="192" width="250" height="62" rx="5"/>
  <text class="bold" x="135" y="216" text-anchor="middle">script-terminating</text>
  <text x="135" y="238" text-anchor="middle" font-size="13">throw, -ErrorAction Stop</text>
  <rect class="zone-user" x="340" y="192" width="160" height="62" rx="5"/>
  <text class="bold" x="420" y="228" text-anchor="middle">yes</text>
  <rect class="zone-user" x="530" y="192" width="180" height="62" rx="5"/>
  <text class="bold" x="620" y="228" text-anchor="middle">stops, exit 1</text>
  <text class="dim" x="10" y="274" font-size="13">As observed in Windows PowerShell 5.1 and PowerShell 7.6.</text>
</svg>
