<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-label="The main folders of a Windows installation" font-family="Segoe UI, sans-serif">
  <title>The main folders of a Windows installation</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    .accent { stroke: #3b7dd8; stroke-width: 2.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <text class="bold" x="20" y="28">C:\</text>
  <text class="dim" x="390" y="28">%SystemDrive%</text>
  <line class="wire" x1="32" y1="34" x2="32" y2="53"/>
  <line class="wire" x1="32" y1="53" x2="50" y2="53"/>
  <text class="bold" x="54" y="58">Windows</text>
  <text class="dim" x="390" y="58">the operating system (%SystemRoot%)</text>
  <line class="wire" x1="66" y1="64" x2="66" y2="83"/>
  <line class="wire" x1="66" y1="83" x2="84" y2="83"/>
  <text class="bold" x="88" y="88">System32</text>
  <text class="dim" x="390" y="88">core programs, libraries, and the drivers folder</text>
  <line class="wire" x1="66" y1="64" x2="66" y2="113"/>
  <line class="wire" x1="66" y1="113" x2="84" y2="113"/>
  <text class="bold" x="88" y="118">INF</text>
  <text class="dim" x="390" y="118">driver setup files and setupapi.dev.log</text>
  <line class="wire" x1="32" y1="34" x2="32" y2="143"/>
  <line class="wire" x1="32" y1="143" x2="50" y2="143"/>
  <text class="bold" x="54" y="148">Program Files</text>
  <text class="dim" x="390" y="148">64-bit applications</text>
  <line class="wire" x1="32" y1="34" x2="32" y2="173"/>
  <line class="wire" x1="32" y1="173" x2="50" y2="173"/>
  <text class="bold" x="54" y="178">Program Files (x86)</text>
  <text class="dim" x="390" y="178">32-bit applications</text>
  <line class="wire" x1="32" y1="34" x2="32" y2="203"/>
  <line class="wire" x1="32" y1="203" x2="50" y2="203"/>
  <text class="bold" x="54" y="208">ProgramData</text>
  <text class="dim" x="390" y="208">data shared by all users (hidden by default)</text>
  <line class="wire" x1="32" y1="34" x2="32" y2="233"/>
  <line class="wire" x1="32" y1="233" x2="50" y2="233"/>
  <text class="bold" x="54" y="238">Users</text>
  <text class="dim" x="390" y="238">one folder per person</text>
  <line class="wire" x1="66" y1="244" x2="66" y2="263"/>
  <line class="wire" x1="66" y1="263" x2="84" y2="263"/>
  <text class="bold" x="88" y="268">student</text>
  <text class="dim" x="390" y="268">one profile (%USERPROFILE%)</text>
  <line class="wire" x1="100" y1="274" x2="100" y2="293"/>
  <line class="wire" x1="100" y1="293" x2="118" y2="293"/>
  <text class="bold" x="122" y="298">Documents, Desktop, Downloads ...</text>
  <line class="wire" x1="100" y1="274" x2="100" y2="323"/>
  <line class="wire" x1="100" y1="323" x2="118" y2="323"/>
  <text class="bold" x="122" y="328">AppData</text>
  <text class="dim" x="390" y="328">per-user application data (hidden by default)</text>
  <line class="wire" x1="100" y1="274" x2="100" y2="353"/>
  <line class="wire" x1="100" y1="353" x2="118" y2="353"/>
  <text class="bold" x="122" y="358">NTUSER.DAT</text>
  <text class="dim" x="390" y="358">that user's registry hive</text>
</svg>
