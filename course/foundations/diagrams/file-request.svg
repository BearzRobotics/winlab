<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Opening a file, step by step, crossing into kernel mode and back" font-family="Segoe UI, sans-serif">
  <title>Opening a file, step by step, crossing into kernel mode and back</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    .accent { stroke: #3b7dd8; stroke-width: 2.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="zone-user" x="10" y="10" width="700" height="140" rx="8"/>
  <text class="dim" x="696" y="32" text-anchor="end" font-size="13">user mode</text>
  <rect class="box" x="40" y="24" width="520" height="34" rx="5"/>
  <text x="56" y="46">1. your program: "open C:\Logs\app.log"</text>
  <line class="wire" x1="300" y1="58" x2="300" y2="68"/>
  <rect class="box" x="40" y="68" width="520" height="30" rx="5"/>
  <text x="56" y="88">2. Win32 library: checks and prepares the request</text>
  <line class="wire" x1="300" y1="98" x2="300" y2="108"/>
  <rect class="box" x="40" y="108" width="520" height="30" rx="5"/>
  <text x="56" y="128">3. ntdll.dll: issues the system call</text>

  <line class="wire accent" x1="300" y1="138" x2="300" y2="190" marker-end="url(#arrow)"/>
  <text class="bold" x="316" y="170" font-size="13">the processor switches to kernel mode</text>

  <rect class="zone-kernel" x="10" y="190" width="700" height="112" rx="8"/>
  <text class="dim" x="696" y="212" text-anchor="end" font-size="13">kernel mode</text>
  <rect class="box" x="40" y="204" width="520" height="38" rx="5"/>
  <text class="bold" x="56" y="228">4. kernel: MAY THIS USER open it?  No: "Access is denied"</text>
  <line class="wire" x1="300" y1="242" x2="300" y2="256"/>
  <rect class="box" x="40" y="256" width="520" height="34" rx="5"/>
  <text x="56" y="278">5. file system and disk drivers fetch what is needed</text>

  <line class="wire accent" x1="300" y1="290" x2="300" y2="346" marker-end="url(#arrow)"/>
  <text class="bold" x="316" y="326" font-size="13">and switches back</text>

  <rect class="zone-user" x="10" y="346" width="700" height="46" rx="8"/>
  <text x="56" y="374">6. your program gets a HANDLE (a ticket for the open file), or an error</text>
</svg>
