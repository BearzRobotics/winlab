<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="How to read a PowerShell syntax line: brackets mean optional, angle brackets give the value type" font-family="Segoe UI, sans-serif">
  <title>Reading a SYNTAX line</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="14" width="140" height="40" rx="4"/>
  <text class="mono" x="80" y="40" text-anchor="middle" font-size="15">Stop-Process</text>
  <rect class="zone-user" x="160" y="14" width="190" height="40" rx="4"/>
  <text class="mono" x="255" y="40" text-anchor="middle" font-size="15">[-Id] &lt;int[]&gt;</text>
  <rect class="zone-kernel" x="360" y="14" width="150" height="40" rx="4"/>
  <text class="mono" x="435" y="40" text-anchor="middle" font-size="15">[-PassThru]</text>
  <rect class="zone-kernel" x="520" y="14" width="190" height="40" rx="4"/>
  <text class="mono" x="615" y="40" text-anchor="middle" font-size="15">[-Force] ...</text>

  <line class="wire" x1="80" y1="54" x2="80" y2="84"/>
  <text class="bold" x="80" y="104" text-anchor="middle">the cmdlet</text>

  <line class="wire" x1="200" y1="54" x2="200" y2="136"/>
  <text class="bold" x="170" y="156">[-Id]: the NAME is optional</text>
  <text class="dim" x="170" y="176" font-size="13">so a number may be given by position</text>

  <line class="wire" x1="310" y1="54" x2="310" y2="196"/>
  <text class="bold" x="170" y="216">&lt;int[]&gt;: whole numbers, one or a list</text>
  <text class="dim" x="170" y="236" font-size="13">no brackets around the pair: it is required</text>

  <line class="wire" x1="560" y1="54" x2="560" y2="84"/>
  <text class="bold" x="560" y="104" text-anchor="middle">[ ... ] optional</text>
  <text class="dim" x="560" y="124" text-anchor="middle" font-size="13">a switch has no value</text>
</svg>
