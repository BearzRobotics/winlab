<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="The five phases cmd goes through for a line: percent expansion, special characters, for variables, delayed expansion, then redirections and running" font-family="Segoe UI, sans-serif">
  <title>The phases of the cmd parser, as observed</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="zone-kernel" x="10" y="20" width="220" height="62" rx="6"/>
  <text class="bold" x="120" y="46" text-anchor="middle">1. percent</text>
  <text x="120" y="68" text-anchor="middle">%var%  %1  (whole block)</text>
  <line class="wire" x1="230" y1="51" x2="248" y2="51" marker-end="url(#arrow)"/>
  <rect class="zone-kernel" x="250" y="20" width="220" height="62" rx="6"/>
  <text class="bold" x="360" y="46" text-anchor="middle">2. special characters</text>
  <text x="360" y="68" text-anchor="middle">&amp; | &lt; &gt; ( ) and ^</text>
  <line class="wire" x1="470" y1="51" x2="488" y2="51" marker-end="url(#arrow)"/>
  <rect class="box" x="490" y="20" width="220" height="62" rx="6"/>
  <text class="bold" x="600" y="46" text-anchor="middle">3. for variables</text>
  <text x="600" y="68" text-anchor="middle">%%i, each pass</text>

  <line class="wire" x1="600" y1="82" x2="600" y2="126" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="490" y="128" width="220" height="62" rx="6"/>
  <text class="bold" x="600" y="154" text-anchor="middle">4. delayed</text>
  <text x="600" y="176" text-anchor="middle">!var!</text>
  <line class="wire" x1="490" y1="159" x2="472" y2="159" marker-end="url(#arrow)"/>
  <rect class="box" x="250" y="128" width="220" height="62" rx="6"/>
  <text class="bold" x="360" y="154" text-anchor="middle">5. run</text>
  <text x="360" y="176" text-anchor="middle">redirections, pipes</text>

  <text class="dim" x="10" y="218" font-size="13">Text inserted in phase 1 is examined again in phase 2: its &amp; is obeyed.</text>
  <text class="dim" x="10" y="238" font-size="13">Text inserted in phase 4 is not. But a pipe starts new cmds, which parse again.</text>
</svg>
