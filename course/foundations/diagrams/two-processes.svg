<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="One program file started twice makes two separate processes" font-family="Segoe UI, sans-serif">
  <title>One program file started twice makes two separate processes</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    .accent { stroke: #3b7dd8; stroke-width: 2.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <text class="dim" x="95" y="30" text-anchor="middle" font-size="13">ON DISK</text>
  <rect class="hardware" x="20" y="96" width="150" height="52" rx="5"/>
  <text class="bold" x="95" y="119" text-anchor="middle">cmd.exe</text>
  <text x="95" y="138" text-anchor="middle" font-size="13">one file</text>

  <line class="wire" x1="170" y1="108" x2="262" y2="70" marker-end="url(#arrow)"/>
  <text x="200" y="68" text-anchor="middle" font-size="13">start</text>
  <line class="wire" x1="170" y1="136" x2="262" y2="188" marker-end="url(#arrow)"/>
  <text x="196" y="190" text-anchor="middle" font-size="13">start again</text>

  <text class="dim" x="486" y="22" text-anchor="middle" font-size="13">IN MEMORY (running)</text>
  <rect class="zone-user" x="262" y="34" width="448" height="92" rx="8"/>
  <text class="bold" x="282" y="60">process, PID 4896</text>
  <text x="282" y="86">its own memory     runs as a user</text>
  <text x="282" y="110">4 threads     82 handles (open files, registry keys, ...)</text>
  <rect class="zone-user" x="262" y="142" width="448" height="92" rx="8"/>
  <text class="bold" x="282" y="168">process, PID 12516</text>
  <text x="282" y="194">its own memory     runs as a user</text>
  <text x="282" y="218">4 threads     82 handles</text>
</svg>
