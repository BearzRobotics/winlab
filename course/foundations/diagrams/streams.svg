<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="Standard input, standard output and standard error" font-family="Segoe UI, sans-serif">
  <title>The three standard streams</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="60" width="170" height="60" rx="5"/>
  <text x="95" y="86" text-anchor="middle">keyboard, file</text>
  <text x="95" y="106" text-anchor="middle">or pipe</text>
  <line class="wire" x1="180" y1="90" x2="278" y2="90" marker-end="url(#arrow)"/>
  <text class="bold" x="229" y="80" text-anchor="middle" font-size="13">0 input</text>

  <rect class="zone-user" x="280" y="46" width="150" height="88" rx="8"/>
  <text class="bold" x="355" y="96" text-anchor="middle" font-size="16">command</text>

  <line class="wire" x1="430" y1="66" x2="538" y2="36" marker-end="url(#arrow)"/>
  <text class="bold" x="440" y="36" font-size="13">1 output</text>
  <rect class="box" x="540" y="14" width="170" height="44" rx="5"/>
  <text x="625" y="41" text-anchor="middle">screen, file, pipe</text>

  <line class="wire" x1="430" y1="114" x2="538" y2="144" marker-end="url(#arrow)"/>
  <text class="bold" x="440" y="154" font-size="13">2 errors</text>
  <rect class="zone-kernel" x="540" y="122" width="170" height="44" rx="5"/>
  <text x="625" y="149" text-anchor="middle">screen or file</text>
</svg>
