<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="robocopy mirror copies new and changed files and deletes files that exist only at the destination" font-family="Segoe UI, sans-serif">
  <title>What robocopy /mir does</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="bold" x="110" y="24" text-anchor="middle">source</text>
  <text class="bold" x="470" y="24" text-anchor="middle">destination, before</text>
  <rect class="zone-user" x="10" y="36" width="200" height="146" rx="8"/>
  <text class="mono" x="30" y="68" font-size="15">keep.txt (newer)</text>
  <text class="mono" x="30" y="104" font-size="15">sub\new.txt</text>

  <rect class="box" x="360" y="36" width="350" height="146" rx="8"/>
  <text class="mono" x="380" y="68" font-size="15">keep.txt (older)</text>
  <rect class="zone-kernel" x="372" y="118" width="326" height="26" rx="4"/>
  <text class="mono" x="380" y="136" font-size="15">old-report.txt</text>
  <rect class="zone-kernel" x="372" y="148" width="326" height="26" rx="4"/>
  <text class="mono" x="380" y="166" font-size="15">stale\x.log</text>

  <line class="wire" x1="210" y1="63" x2="372" y2="63" marker-end="url(#arrow)"/>
  <text x="290" y="54" text-anchor="middle" font-size="13">Changed: copied</text>
  <line class="wire" x1="210" y1="99" x2="372" y2="99" marker-end="url(#arrow)"/>
  <text x="290" y="90" text-anchor="middle" font-size="13">New File: copied</text>
  <text class="bold" x="690" y="136" text-anchor="end" font-size="13">*EXTRA: DELETED</text>
  <text class="bold" x="690" y="166" text-anchor="end" font-size="13">*EXTRA: DELETED</text>

  <text class="bold" x="10" y="216">Rehearse with /l: it lists all of this and changes nothing.</text>
  <text class="dim" x="10" y="238" font-size="13">/mir makes the destination a copy of the source, whatever was in the destination before.</text>
</svg>
