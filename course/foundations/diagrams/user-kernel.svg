<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="User mode, kernel mode and hardware" font-family="Segoe UI, sans-serif">
  <title>User mode, kernel mode and hardware</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    .accent { stroke: #3b7dd8; stroke-width: 2.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b7dd8"/>
    </marker>
  </defs>

  <rect class="zone-user" x="10" y="10" width="700" height="180" rx="8"/>
  <text class="bold" x="28" y="36" font-size="16">USER MODE</text>
  <text class="dim" x="692" y="36" font-size="13" text-anchor="end">each process is walled off from the others</text>

  <rect class="box" x="40" y="54" width="130" height="38" rx="5"/>
  <text x="105" y="78" text-anchor="middle">notepad</text>
  <rect class="box" x="210" y="54" width="130" height="38" rx="5"/>
  <text x="275" y="78" text-anchor="middle">browser</text>
  <rect class="box" x="380" y="54" width="130" height="38" rx="5"/>
  <text x="445" y="78" text-anchor="middle">powershell</text>
  <rect class="box" x="550" y="54" width="130" height="38" rx="5"/>
  <text x="615" y="78" text-anchor="middle">a service</text>

  <line class="wire" x1="105" y1="92" x2="105" y2="114"/>
  <line class="wire" x1="275" y1="92" x2="275" y2="114"/>
  <line class="wire" x1="445" y1="92" x2="445" y2="114"/>
  <line class="wire" x1="615" y1="92" x2="615" y2="114"/>
  <line class="wire" x1="105" y1="114" x2="615" y2="114"/>
  <line class="wire" x1="360" y1="114" x2="360" y2="132"/>

  <rect class="box" x="170" y="132" width="380" height="40" rx="5"/>
  <text x="360" y="157" text-anchor="middle">system libraries: kernel32.dll ... ntdll.dll</text>

  <line class="wire accent" x1="360" y1="172" x2="360" y2="232" marker-end="url(#arrow)"/>
  <text class="bold" x="376" y="206" font-size="13">system call: the way down</text>

  <rect class="zone-kernel" x="10" y="212" width="700" height="136" rx="8"/>
  <text class="bold" x="28" y="238" font-size="16">KERNEL MODE</text>

  <rect class="box" x="60" y="248" width="600" height="38" rx="5"/>
  <text x="360" y="272" text-anchor="middle">Windows kernel and executive: processes, memory, files, security checks, I/O</text>
  <rect class="box" x="60" y="296" width="600" height="38" rx="5"/>
  <text x="360" y="320" text-anchor="middle">drivers: disk, file system, network, USB, graphics ...</text>

  <line class="wire" x1="360" y1="348" x2="360" y2="366" marker-end="url(#arrow)"/>

  <rect class="hardware" x="10" y="368" width="700" height="42" rx="8"/>
  <text class="bold" x="28" y="394">HARDWARE</text>
  <text x="250" y="394" text-anchor="middle">processor</text>
  <text x="350" y="394" text-anchor="middle">memory</text>
  <text x="440" y="394" text-anchor="middle">disks</text>
  <text x="530" y="394" text-anchor="middle">network</text>
  <text x="620" y="394" text-anchor="middle">USB</text>
</svg>
