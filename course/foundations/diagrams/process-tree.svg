<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="A parent chain: explorer, Windows Terminal, PowerShell; the first parent has exited" font-family="Segoe UI, sans-serif">
  <title>A parent chain: explorer, Windows Terminal, PowerShell; the first parent has exited</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    .accent { stroke: #3b7dd8; stroke-width: 2.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="box dashed" x="20" y="12" width="220" height="40" rx="5"/>
  <text class="dim" x="130" y="37" text-anchor="middle">pid 8920: already exited</text>
  <line class="wire" x1="60" y1="52" x2="60" y2="94"/>
  <line class="wire" x1="60" y1="94" x2="90" y2="94" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="90" y="74" width="260" height="40" rx="5"/>
  <text class="bold" x="106" y="99">explorer.exe</text>
  <text x="334" y="99" text-anchor="end">pid 8976</text>
  <text class="dim" x="368" y="99">your desktop</text>
  <line class="wire" x1="130" y1="114" x2="130" y2="162"/>
  <line class="wire" x1="130" y1="162" x2="160" y2="162" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="160" y="142" width="300" height="40" rx="5"/>
  <text class="bold" x="176" y="167">WindowsTerminal.exe</text>
  <text x="444" y="167" text-anchor="end">pid 11868</text>
  <text class="dim" x="478" y="167">the terminal window</text>
  <line class="wire" x1="200" y1="182" x2="200" y2="230"/>
  <line class="wire" x1="200" y1="230" x2="230" y2="230" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="230" y="210" width="280" height="40" rx="5"/>
  <text class="bold" x="246" y="235">powershell.exe</text>
  <text x="494" y="235" text-anchor="end">pid 6696</text>
  <text class="dim" x="528" y="235">the shell inside it</text>
</svg>
