<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" role="img" aria-label="Services run in session 0; the signed-in person works in another session" font-family="Segoe UI, sans-serif">
  <title>Services run in session 0; the signed-in person works in another session</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    .accent { stroke: #3b7dd8; stroke-width: 2.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="zone-kernel" x="10" y="10" width="340" height="120" rx="8"/>
  <text class="bold" x="180" y="38" text-anchor="middle">SESSION 0: services, no desktop</text>
  <text x="180" y="76" text-anchor="middle">System, services.exe, spoolsv.exe,</text>
  <text x="180" y="100" text-anchor="middle">most svchost.exe ...</text>
  <rect class="zone-user" x="370" y="10" width="340" height="120" rx="8"/>
  <text class="bold" x="540" y="38" text-anchor="middle">SESSION 1: the person at the screen</text>
  <text x="540" y="76" text-anchor="middle">explorer.exe, your terminal,</text>
  <text x="540" y="100" text-anchor="middle">your browser, your apps ...</text>
  <text x="360" y="162" text-anchor="middle">A window opened in session 0 is NOT shown to the person in session 1</text>
</svg>
