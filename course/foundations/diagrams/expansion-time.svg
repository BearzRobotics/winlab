<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Percent variables are filled in when the line or block is read; exclamation variables when each command runs" font-family="Segoe UI, sans-serif">
  <title>When variables are filled in</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="12" width="210" height="44" rx="5"/>
  <text class="bold" x="115" y="39" text-anchor="middle">1. READ the whole block</text>
  <line class="wire" x1="220" y1="34" x2="258" y2="34" marker-end="url(#arrow)"/>
  <rect class="zone-kernel" x="260" y="12" width="210" height="44" rx="5"/>
  <text class="bold" x="365" y="39" text-anchor="middle">2. fill in every %n%</text>
  <line class="wire" x1="470" y1="34" x2="508" y2="34" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="510" y="12" width="200" height="44" rx="5"/>
  <text class="bold" x="610" y="39" text-anchor="middle">3. RUN, line by line</text>
  <line class="wire" x1="610" y1="56" x2="610" y2="86" marker-end="url(#arrow)"/>

  <rect class="zone-kernel" x="10" y="90" width="340" height="146" rx="8"/>
  <text class="bold" x="180" y="116" text-anchor="middle">echo %n%   (n was 0 at step 2)</text>
  <text x="180" y="146" text-anchor="middle">pass 1: add 1, then run  echo 0</text>
  <text x="180" y="170" text-anchor="middle">pass 2: add 1, then run  echo 0</text>
  <text x="180" y="206" text-anchor="middle">the text was fixed before the</text>
  <text x="180" y="224" text-anchor="middle">loop ever started</text>

  <rect class="zone-user" x="370" y="90" width="340" height="146" rx="8"/>
  <text class="bold" x="540" y="116" text-anchor="middle">echo !n!   (delayed expansion on)</text>
  <text x="540" y="146" text-anchor="middle">pass 1: add 1, then read n: 1</text>
  <text x="540" y="170" text-anchor="middle">pass 2: add 1, then read n: 2</text>
  <text x="540" y="206" text-anchor="middle">read at step 3, each time the</text>
  <text x="540" y="224" text-anchor="middle">command runs</text>
</svg>
