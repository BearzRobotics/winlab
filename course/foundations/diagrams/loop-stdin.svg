<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Inside a while read loop, read and any command in the body share the same input. A command that reads input takes the remaining lines, so the loop ends after one. Giving the command its own input leaves the lines for read" font-family="Segoe UI, sans-serif">
  <title>Who is reading the file?</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="bold" x="180" y="22" text-anchor="middle">shared input</text>
  <rect class="box" x="30" y="34" width="300" height="38" rx="5"/>
  <text x="180" y="58" text-anchor="middle">file: lines 1 2 3 4 5</text>
  <line class="wire" x1="100" y1="72" x2="100" y2="108" marker-end="url(#arrow)"/>
  <line class="wire" x1="260" y1="72" x2="260" y2="108" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="30" y="110" width="140" height="56" rx="5"/>
  <text class="bold" x="100" y="134" text-anchor="middle">read</text>
  <text x="100" y="156" text-anchor="middle" font-size="13">gets line 1</text>
  <rect class="zone-kernel" x="190" y="110" width="140" height="56" rx="5"/>
  <text class="bold" x="260" y="134" text-anchor="middle">cat</text>
  <text x="260" y="156" text-anchor="middle" font-size="13">takes 2 to 5</text>
  <text class="bold" x="180" y="200" text-anchor="middle">the loop runs ONCE</text>

  <text class="bold" x="540" y="22" text-anchor="middle">cat &lt; /dev/null</text>
  <rect class="box" x="390" y="34" width="300" height="38" rx="5"/>
  <text x="540" y="58" text-anchor="middle">file: lines 1 2 3 4 5</text>
  <line class="wire" x1="460" y1="72" x2="460" y2="108" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="390" y="110" width="140" height="56" rx="5"/>
  <text class="bold" x="460" y="134" text-anchor="middle">read</text>
  <text x="460" y="156" text-anchor="middle" font-size="13">gets every line</text>
  <rect class="box" x="550" y="110" width="140" height="56" rx="5"/>
  <text class="bold" x="620" y="134" text-anchor="middle">cat</text>
  <text x="620" y="156" text-anchor="middle" font-size="13">reads nothing</text>
  <text class="bold" x="540" y="200" text-anchor="middle">the loop runs FIVE times</text>
  <text class="dim" x="30" y="248" font-size="13">Every command in the body inherits the loop's input unless you give it another.</text>
</svg>
