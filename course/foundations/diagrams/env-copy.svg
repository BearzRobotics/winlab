<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Each new process gets a copy of the environment; changes never go back to the parent" font-family="Segoe UI, sans-serif">
  <title>The environment is copied downwards only</title>
  <style>
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="zone-user" x="20" y="30" width="260" height="90" rx="8"/>
  <text class="bold" x="150" y="56" text-anchor="middle">your cmd (the parent)</text>
  <text class="mono" x="150" y="84" text-anchor="middle" font-size="14">FROM=parent</text>
  <text class="dim" x="150" y="106" text-anchor="middle" font-size="13">stays "parent"</text>

  <line class="wire" x1="280" y1="60" x2="438" y2="60" marker-end="url(#arrow)"/>
  <text x="359" y="48" text-anchor="middle" font-size="13">starts it: a COPY</text>

  <rect class="zone-kernel" x="440" y="30" width="260" height="90" rx="8"/>
  <text class="bold" x="570" y="56" text-anchor="middle">a new process (child)</text>
  <text class="mono" x="570" y="84" text-anchor="middle" font-size="14">set "FROM=child"</text>
  <text class="dim" x="570" y="106" text-anchor="middle" font-size="13">changes only its copy</text>

  <line class="wire" x1="440" y1="102" x2="286" y2="102"/>
  <text class="bold" x="363" y="122" text-anchor="middle" font-size="13">never goes back</text>

  <rect class="zone-user" x="20" y="158" width="680" height="62" rx="8"/>
  <text class="bold" x="360" y="184" text-anchor="middle">call child.cmd runs in the SAME cmd: no copy</text>
  <text x="360" y="206" text-anchor="middle">so its changes stay, unless the script uses setlocal</text>
</svg>
