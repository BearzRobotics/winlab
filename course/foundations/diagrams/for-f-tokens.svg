<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="for /f cuts a line at the delimiters into tokens; two delimiters together count as one, so an empty field disappears" font-family="Segoe UI, sans-serif">
  <title>How for /f splits a line</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="bold" x="10" y="24">tokens=1-3 delims=,</text>
  <rect class="box" x="10" y="36" width="190" height="36" rx="4"/>
  <text class="mono" x="105" y="59" text-anchor="middle" font-size="16">1,Ann,Leeds</text>
  <line class="wire" x1="200" y1="54" x2="258" y2="54" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="260" y="36" width="130" height="36" rx="4"/>
  <text class="mono" x="325" y="59" text-anchor="middle" font-size="15">%%a = 1</text>
  <rect class="zone-user" x="400" y="36" width="140" height="36" rx="4"/>
  <text class="mono" x="470" y="59" text-anchor="middle" font-size="15">%%b = Ann</text>
  <rect class="zone-user" x="550" y="36" width="160" height="36" rx="4"/>
  <text class="mono" x="630" y="59" text-anchor="middle" font-size="15">%%c = Leeds</text>

  <text class="bold" x="10" y="112">An empty field disappears</text>
  <rect class="box" x="10" y="124" width="190" height="36" rx="4"/>
  <text class="mono" x="105" y="147" text-anchor="middle" font-size="16">2,,York</text>
  <line class="wire" x1="200" y1="142" x2="258" y2="142" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="260" y="124" width="130" height="36" rx="4"/>
  <text class="mono" x="325" y="147" text-anchor="middle" font-size="15">%%a = 2</text>
  <rect class="zone-kernel" x="400" y="124" width="140" height="36" rx="4"/>
  <text class="mono" x="470" y="147" text-anchor="middle" font-size="15">%%b = York</text>
  <rect class="zone-kernel" x="550" y="124" width="160" height="36" rx="4"/>
  <text class="mono" x="630" y="147" text-anchor="middle" font-size="15">%%c (empty)</text>
  <text class="dim" x="10" y="182" font-size="13">Two commas together count as one separator, so York moves into the name column.</text>

  <text class="bold" x="10" y="220">tokens=1,*  keeps the rest of the line together</text>
  <rect class="box" x="10" y="230" width="230" height="32" rx="4"/>
  <text class="mono" x="125" y="251" text-anchor="middle" font-size="14">ERROR 42 disk is full</text>
  <line class="wire" x1="240" y1="246" x2="298" y2="246" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="300" y="230" width="140" height="32" rx="4"/>
  <text class="mono" x="370" y="251" text-anchor="middle" font-size="14">%%a = ERROR</text>
  <rect class="zone-user" x="450" y="230" width="260" height="32" rx="4"/>
  <text class="mono" x="580" y="251" text-anchor="middle" font-size="14">%%b = 42 disk is full</text>
</svg>
