<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Each process has a private address space; kernel mode shares one" font-family="Segoe UI, sans-serif">
  <title>Each process has a private address space; kernel mode shares one</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .hardware { fill: #eceff1; stroke: #57606a }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    .accent { stroke: #3b7dd8; stroke-width: 2.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="zone-user" x="10" y="10" width="170" height="150" rx="8"/>
  <text class="bold" x="95" y="38" text-anchor="middle">process A</text>
  <text x="95" y="76" text-anchor="middle">its own program,</text>
  <text x="95" y="98" text-anchor="middle">data and</text>
  <text x="95" y="120" text-anchor="middle">libraries</text>
  <rect class="zone-user" x="200" y="10" width="170" height="150" rx="8"/>
  <text class="bold" x="285" y="38" text-anchor="middle">process B</text>
  <text x="285" y="76" text-anchor="middle">its own program,</text>
  <text x="285" y="98" text-anchor="middle">data and</text>
  <text x="285" y="120" text-anchor="middle">libraries</text>
  <rect class="zone-kernel" x="430" y="10" width="280" height="150" rx="8"/>
  <text class="bold" x="570" y="38" text-anchor="middle">kernel mode</text>
  <text x="570" y="76" text-anchor="middle">ONE shared space:</text>
  <text x="570" y="98" text-anchor="middle">the kernel and every</text>
  <text x="570" y="120" text-anchor="middle">kernel-mode driver</text>
  <text x="190" y="192" text-anchor="middle" font-size="13">A cannot reach B's memory directly</text>
  <text x="570" y="192" text-anchor="middle" font-size="13">a bad driver CAN damage the kernel</text>
  <text x="570" y="212" text-anchor="middle" font-size="13">and other drivers</text>
</svg>
