<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="The foreach statement collects all items before handling any; ForEach-Object handles each as it is produced" font-family="Segoe UI, sans-serif">
  <title>foreach statement against ForEach-Object</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
    .mono { font-family: Consolas, monospace }
  </style>

  <text class="bold" x="10" y="24">foreach ($x in Get-Slowly) { }   collects everything first</text>
  <rect class="zone-kernel" x="10" y="36" width="104" height="34" rx="4"/>
  <text x="62" y="58" text-anchor="middle" font-size="13">produce 1</text>
  <rect class="zone-kernel" x="120" y="36" width="104" height="34" rx="4"/>
  <text x="172" y="58" text-anchor="middle" font-size="13">produce 2</text>
  <rect class="zone-kernel" x="230" y="36" width="104" height="34" rx="4"/>
  <text x="282" y="58" text-anchor="middle" font-size="13">produce 3</text>
  <rect class="zone-user" x="340" y="36" width="104" height="34" rx="4"/>
  <text x="392" y="58" text-anchor="middle" font-size="13">handle 1</text>
  <rect class="zone-user" x="450" y="36" width="104" height="34" rx="4"/>
  <text x="502" y="58" text-anchor="middle" font-size="13">handle 2</text>
  <rect class="zone-user" x="560" y="36" width="104" height="34" rx="4"/>
  <text x="612" y="58" text-anchor="middle" font-size="13">handle 3</text>

  <text class="bold" x="10" y="112">Get-Slowly | ForEach-Object { }   streams</text>
  <rect class="zone-kernel" x="10" y="124" width="104" height="34" rx="4"/>
  <text x="62" y="146" text-anchor="middle" font-size="13">produce 1</text>
  <rect class="zone-user" x="120" y="124" width="104" height="34" rx="4"/>
  <text x="172" y="146" text-anchor="middle" font-size="13">handle 1</text>
  <rect class="zone-kernel" x="230" y="124" width="104" height="34" rx="4"/>
  <text x="282" y="146" text-anchor="middle" font-size="13">produce 2</text>
  <rect class="zone-user" x="340" y="124" width="104" height="34" rx="4"/>
  <text x="392" y="146" text-anchor="middle" font-size="13">handle 2</text>
  <rect class="zone-kernel" x="450" y="124" width="104" height="34" rx="4"/>
  <text x="502" y="146" text-anchor="middle" font-size="13">produce 3</text>
  <rect class="zone-user" x="560" y="124" width="104" height="34" rx="4"/>
  <text x="612" y="146" text-anchor="middle" font-size="13">handle 3</text>
  <text class="dim" x="10" y="188" font-size="13">Time runs from left to right. These orders were observed with Write-Host.</text>
</svg>
