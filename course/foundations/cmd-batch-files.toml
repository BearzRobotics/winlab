schema_version = 1
id = "foundations.cmd-batch-files"
title = "Writing dependable batch files"
summary = "A script template, argument parsing and validation, logging with locale-independent timestamps, configuration files, elevation checks, starting and calling programs, running unattended, debugging, security, and a complete worked backup script."
content = "cmd-batch-files.md"
estimated_minutes = 110
level = 3
objectives = [
  "Start every script from a template with setlocal, pushd and an explicit exit code",
  "Save batch files with correct line endings and encoding",
  "Validate arguments, parse switches in a loop, and quote whole arguments correctly",
  "Log to a file and get a timestamp that does not depend on regional settings",
  "Read a key=value configuration file with for /f",
  "Detect elevation and choose between failing, self-elevating and relying on Task Scheduler",
  "Start programs with call, start, start /wait, cmd /c and PowerShell, and read their exit codes",
  "Make a script safe to run unattended and debug it with echo, dry-run switches and logs",
  "Apply the security rules: quote everything, guard deletes, never run text built from input",
]
prerequisites = ["foundations.cmd-control-flow"]
windows_features = ["Command Prompt", "Task Scheduler"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner writes a script that validates its arguments and exits with distinct codes, and tests each code",
  "Learner adds a dry-run switch that prints the commands it would run instead of running them",
  "Learner runs a script from Task Scheduler and explains one difference from running it at the prompt",
]

