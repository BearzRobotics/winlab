schema_version = 1
id = "foundations.ps-working-with-data"
title = "PowerShell: files, text, CSV, JSON, XML and the web"
summary = "Paths and the -LiteralPath trap, reading and writing text with the encoding differences between 5.1 and 7 and Linux, Select-String, CSV and its all-strings trap, JSON depth and one-element-array traps, XML, comparing data, and Invoke-RestMethod and Invoke-WebRequest including HTTP errors."
content = "ps-working-with-data.md"
estimated_minutes = 140
level = 3
objectives = [
  "Build and take apart paths portably, and use -LiteralPath for names that come from data",
  "Read text as lines or one string, stream large files, and avoid the one-line-file indexing bug",
  "Write text with a deliberate encoding, and explain what Out-File, Set-Content and > produce in 5.1, 7 and on Linux",
  "Search with Select-String and use its match objects, context and regular-expression groups",
  "Import and export CSV, convert string columns to numbers and dates, summarise with Group-Object, and join with a hashtable",
  "Convert to and from JSON with enough -Depth, and avoid the one-element-array and date traps",
  "Read, query, change and save XML, and cache PowerShell objects with Clixml",
  "Compare files and data and verify downloads with Compare-Object and Get-FileHash",
  "Call web APIs with Invoke-RestMethod and Invoke-WebRequest, send JSON and headers, and handle HTTP errors in 5.1 and 7",
]
prerequisites = ["foundations.ps-functions-and-scripts"]
windows_features = ["Windows PowerShell"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner shows the bytes each writer produces and explains the differences by edition",
  "Learner converts CSV strings to numbers and dates and produces a correct per-group summary",
  "Learner serialises nested data with enough depth and shows the data survives a round trip",
  "Learner calls a local API, sends JSON with a header, and handles a failing request on both editions",
]

