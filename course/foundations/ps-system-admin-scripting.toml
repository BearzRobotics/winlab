schema_version = 1
id = "foundations.ps-system-admin-scripting"
title = "PowerShell for system administration: CIM, registry, services, event logs and tasks"
summary = "Query Windows with CIM and WQL, read and change the registry with the right types, control services, filter and write event logs, build scheduled tasks, and make every change previewable (-WhatIf) and repeatable (idempotent), with a checklist for reading an unknown administration script."
content = "ps-system-admin-scripting.md"
estimated_minutes = 120
objectives = [
  "Query system information with Get-CimInstance, filter at the source with WQL, and discover classes and methods",
  "Read and change registry values with the right type, and explain the traps: no overwrite, guessed types, wildcard paths, Test-Path on values",
  "Control services and audit them with Get-Service and Win32_Service, and read the System log trail",
  "Find events fast with Get-WinEvent -FilterHashtable, handle the no-match error, and write your own events",
  "Build, run, check and remove a scheduled task from its action, trigger, principal and settings",
  "Write an idempotent function that supports -WhatIf and reports changed or unchanged",
  "Read an unknown administration script and list the persistence, privilege and evidence-erasing lines in it",
]
prerequisites = ["foundations.ps-errors-and-debugging"]
windows_features = ["Windows PowerShell", "Windows Management Instrumentation", "Task Scheduler", "Event Viewer", "Services", "Registry Editor"]
privilege = "administrator"
certifications = ["comptia-a-core2/operating-systems", "comptia-a-core2/security", "microsoft-md-102/manage-maintain-devices"]
evaluation_criteria = [
  "Learner gets uptime from CIM without parsing text",
  "Learner creates registry values of three types and proves New-ItemProperty will not overwrite",
  "Learner finds events with a filter hashtable and treats no match as an empty result",
  "Learner registers, runs, checks and removes a scheduled task in a lab VM",
  "Learner writes a function that is safe to run twice and previews with -WhatIf",
  "Learner lists every persistence and defence-weakening line in the script from exercise 6",
]

