schema_version = 1
id = "foundations.bash-variables-and-expansion"
title = "Bash variables, quoting and expansion"
summary = "The order in which bash rewrites a command line, why unquoted variables are the commonest bug, IFS and word splitting, parameter expansion, indexed and associative arrays, globbing options, braces, command substitution and its status traps, integer arithmetic (octal, wraparound, set -e) and why arithmetic or eval on untrusted text runs commands."
content = "bash-variables-and-expansion.md"
estimated_minutes = 150
level = 2
objectives = [
  "State the order of expansions and say which steps quoting disables",
  "Predict the number of words a command receives for quoted and unquoted variables, $@, $*, arrays and globs, using a word-counting helper",
  "Use the default and error operators (:- := :? :+ and their colon-less forms) and explain set versus empty versus unset",
  "Trim, replace, slice and change the case of values with parameter expansion, and name which forms are POSIX",
  "Use indexed and associative arrays correctly, including expansion forms, holes, sparse arrays and mapfile",
  "Explain globbing: no-match behaviour, nullglob, failglob, dotglob, globstar, extglob and the leading-dash file name problem",
  "Explain command-substitution status traps, including local v=$(cmd), and the loss of variables in pipelines and subshells",
  "Avoid arithmetic traps: octal, no floats, wraparound, (( )) status under set -e",
  "Explain why arithmetic, [[ -eq ]] and eval on untrusted text can run commands, and read an unknown script for these lines",
]
prerequisites = ["foundations.shells-and-posix"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner predicts, then verifies with args, the word count of at least six quoted and unquoted expansions",
  "Learner writes a file loop that survives spaces, a leading dash and zero matches",
  "Learner builds a path-splitting set of expansions without calling basename or dirname",
  "Learner demonstrates the local v=$(cmd) status trap and the fix",
  "Learner finds every expansion problem in the exercise-9 script and states what an injected argument does",
]

[[references]]
title = "Bash Reference Manual: Shell Expansions, Parameter Expansion, Arrays, Arithmetic (Chet Ramey)"
url = "https://tiswww.case.edu/php/chet/bash/bashref.html"

[[references]]
title = "POSIX Shell Command Language, Word Expansions (The Open Group)"
url = "https://pubs.opengroup.org/onlinepubs/9799919799/utilities/V3_chap02.html"

