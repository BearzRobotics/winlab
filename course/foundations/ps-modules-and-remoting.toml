schema_version = 1
id = "foundations.ps-modules-and-remoting"
title = "PowerShell modules, signing, secrets, jobs and remoting"
summary = "Writing and versioning modules, how PSModulePath differs between 5.1 and 7, the PowerShell Gallery as a trust decision, Authenticode signing, credentials and SecureString limits, background and thread jobs with $using and serialization, and remoting over WinRM and SSH including the default access error and the second hop."
content = "ps-modules-and-remoting.md"
estimated_minutes = 120
objectives = [
  "Explain where PowerShell finds modules and how 5.1 and 7 differ, and use auto-loading and Import-Module",
  "Write a module with a manifest, private helpers, exported commands and side-by-side versions",
  "Treat installing from the PowerShell Gallery as a trust decision: scope, inspection with Save-Module, version pinning",
  "Verify an Authenticode signature, interpret its status, and state what a signature does and does not prove",
  "Handle credentials without plain-text passwords, and state the limits of SecureString and Export-Clixml",
  "Run background jobs and thread jobs, pass variables with $using and -ArgumentList, and explain serialization and job errors",
  "Explain the two remoting transports, the default access rules and how to enable remoting safely",
  "Use Invoke-Command and persistent sessions, and explain $using, result ordering and the second-hop problem",
]
prerequisites = ["foundations.ps-working-with-data"]
windows_features = ["Windows PowerShell", "Windows Remote Management"]
privilege = "administrator"
certifications = ["comptia-a-core2/operating-systems", "comptia-a-core2/security"]
evaluation_criteria = [
  "Learner builds a module whose helper function is hidden and whose versions load side by side",
  "Learner explains why a job could not see a local variable and fixes it two ways",
  "Learner states why a remote connection to localhost was denied from a non-elevated prompt",
  "Learner reviews a script and finds the plain-text password, the Gallery risk and the wildcard TrustedHosts",
]

