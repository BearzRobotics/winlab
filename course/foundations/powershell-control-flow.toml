schema_version = 1
id = "foundations.powershell-control-flow"
title = "PowerShell control flow: decisions and loops"
summary = "if and its assignment trap, switch with its fall-through, regex and wildcard modes, the foreach statement versus ForEach-Object, for, while and do, break, continue and labels, modifying collections safely, parallel loops in PowerShell 7, and reading other people's control flow."
content = "powershell-control-flow.md"
estimated_minutes = 120
level = 2
objectives = [
  "Write if/elseif/else with short-circuit conditions, and spot the assignment-in-condition bug",
  "Use switch with scripts blocks, wildcards, regular expressions and files, and explain why every matching case runs",
  "Choose between the foreach statement and ForEach-Object by memory, speed and how break and return behave",
  "Write for, while, do-while and do-until loops, and a polling loop with a deadline",
  "Use break, continue and labels, and exit a script early",
  "Modify collections safely while looping, and explain the array versus List difference",
  "Use ForEach-Object -Parallel in PowerShell 7 and state its caveats",
  "Read an unfamiliar script's control flow and find the bug",
]
prerequisites = ["foundations.ps-variables-types-operators"]
windows_features = ["Windows PowerShell"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner predicts the output of a switch with several matching cases and fixes it with break",
  "Learner explains why return inside ForEach-Object skips only one item",
  "Learner finds the assignment-in-condition bug in a short script by reading it",
  "Learner writes a polling loop that times out with a non-zero exit code",
]

