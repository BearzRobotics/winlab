schema_version = 1
id = "foundations.ps-advanced"
title = "Advanced PowerShell: classes, .NET, performance, logging and constrained language"
summary = "Classes and enums and their traps, calling .NET directly and compiling C# with Add-Type, measured performance habits (array +=, foreach versus pipeline, Where, -Parallel), script block logging and constrained language mode, and a map of Windows PowerShell 5.1 versus PowerShell 7, with a checklist for reading obfuscated or risky scripts."
content = "ps-advanced.md"
estimated_minutes = 120
level = 5
objectives = [
  "Write a class and an enum, and explain typed properties, hidden, static members, return rules and why a live session cannot redefine a class",
  "Call .NET types and generic collections from PowerShell and explain :: versus . and silent type coercion",
  "Use Add-Type and explain why compiling code at run time deserves scrutiny",
  "Measure with Measure-Command and avoid the array += pattern, choosing between the foreach statement, the pipeline and .Where()",
  "Use ForEach-Object -Parallel with $using and explain when parallelism does not help",
  "Enable and read script block logging (event 4104) and state what it records, including decoded encoded commands and secrets",
  "Explain what constrained language mode blocks and how it differs from execution policy",
  "List the main differences between Windows PowerShell 5.1 and PowerShell 7 and write version-aware scripts",
  "Decode a Base64 command safely and read an obfuscated script without running it",
]
prerequisites = ["foundations.ps-system-admin-scripting"]
windows_features = ["Windows PowerShell", "PowerShell 7", "Event Viewer"]
privilege = "administrator"
certifications = ["comptia-a-core2/security", "comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner writes a class whose method fails to parse without return, and explains why",
  "Learner shows with timings why array += is a performance bug and fixes it",
  "Learner finds an event 4104 for a marker string in a lab VM and removes the policy afterwards",
  "Learner explains the ${u}?.Length trap",
  "Learner decodes the Base64 sample without executing it and names what it begins to do",
]

