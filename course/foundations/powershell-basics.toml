schema_version = 1
id = "foundations.powershell-basics"
title = "PowerShell fundamentals"
summary = "Windows PowerShell 5.1 versus PowerShell 7, starting it, Verb-Noun cmdlets, aliases and parameters, common parameters and -WhatIf, help, objects and the pipeline, formatting versus data, providers and drives, running scripts, execution policy and profiles."
content = "powershell-basics.md"
estimated_minutes = 130
level = 1
objectives = [
  "Tell Windows PowerShell 5.1 from PowerShell 7, and say which to target for a given job",
  "Find a command with Get-Command and learn it with Get-Help, reading the syntax block",
  "Use aliases at the prompt and full names in scripts, and use positional, named and switch parameters",
  "Use common parameters, especially -WhatIf and -ErrorAction",
  "Explain how an object differs from text and inspect one with Get-Member",
  "Filter, sort, group, measure and select with the pipeline, and filter early",
  "Explain why formatting cmdlets belong at the end of a pipeline",
  "Navigate the file system, registry, environment and certificate stores with the same cmdlets",
  "Run a script, explain the execution policy and what it is not, and find and use your profile",
]
prerequisites = ["foundations.architecture"]
windows_features = ["Windows PowerShell", "Windows Terminal"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner lists the five processes using the most memory, showing name and working set, using one pipeline",
  "Learner explains why Format-Table output cannot be passed to Sort-Object usefully",
  "Learner rehearses a delete with -WhatIf before running it",
  "Learner lists registry keys with the same cmdlet used for folders and explains why that works",
]

