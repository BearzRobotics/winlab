schema_version = 1
id = "foundations.troubleshooting-method"
title = "A troubleshooting method"
summary = "Reproduce, scope, observe, hypothesize, test, repair, verify, document, with the built-in Windows and Linux tools for each step, safety nets for changes, and worked examples."
content = "troubleshooting-method.md"
estimated_minutes = 45
objectives = [
  "List the eight steps of the method in order",
  "Explain why each step exists and what goes wrong when it is skipped",
  "Narrow a problem by scope: one user, one machine, everything, or one application",
  "Collect evidence without changing the system, using event logs, service state and recent changes",
  "Write a hypothesis a test could disprove, and design a read-only test that separates two of them",
  "Choose a safety net (note, export, restore point, snapshot) before making a change",
  "Apply the method to a written scenario and produce a short problem record",
]
prerequisites = ["foundations.architecture"]
privilege = "standard"
certifications = ["comptia-a-core2/software-troubleshooting", "comptia-a-core2/operational-procedures", "comptia-network-plus/network-troubleshooting", "comptia-linux-plus/troubleshooting"]
evaluation_criteria = [
  "Learner orders a shuffled list of the eight steps correctly",
  "Learner's problem record names a reproduction, a scope, evidence, a tested hypothesis and a verification",
  "Learner states the command or tool they would use to observe, for each scenario, without changing the system",
]

