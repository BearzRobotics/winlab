schema_version = 1
id = "foundations.cmd-text-and-files"
title = "CMD text and file tools"
summary = "type, more, find, findstr and its regex dialect, sort, fc, copy, xcopy, robocopy with its exit-code bit mask, forfiles, attrib and mklink, for /f over command output, and the same jobs in PowerShell and bash."
content = "cmd-text-and-files.md"
estimated_minutes = 110
level = 3
objectives = [
  "Search text with find and findstr, and use findstr's switches and regular-expression subset",
  "Name what findstr cannot do and recognise a silent no-match caused by an unsupported feature",
  "Sort and compare files, and explain why sort orders numbers as text",
  "Choose between copy, xcopy and robocopy, and use robocopy safely with /l, /mir, retries and logs",
  "Read robocopy's exit code as a bit mask and test it correctly",
  "Select files by age with forfiles and rehearse destructive commands first",
  "Extract a value from a tool's output with for /f, findstr and an escaped pipe",
  "Translate common cmd text and file tasks into PowerShell and bash",
]
prerequisites = ["foundations.cmd-control-flow"]
windows_features = ["Command Prompt", "File Explorer"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner writes a findstr command with line numbers and another that counts matches",
  "Learner mirrors a folder with robocopy, first as a /l dry run, and explains the exit code",
  "Learner extracts an IPv4 address from ipconfig output with for /f and findstr",
]

