schema_version = 1
id = "foundations.bash-basics"
title = "Linux shell and bash scripting fundamentals"
summary = "The first day on the command line, tested on a real machine: help and navigation, copying, moving and removing without destroying data (silent overwrites, leading-dash and space names, links), reading files, permissions, PATH and the environment, redirection order and pipes, exit status, processes and jobs, find and grep, and writing, running, checking and tracing a first bash script."
content = "bash-basics.md"
estimated_minutes = 150
level = 1
objectives = [
  "Run commands, read their manual pages and use help, type and command -v to find out what a name is",
  "Move around the file system with absolute and relative paths and read ls -l output, including permissions, links and hidden files",
  "Copy, move and remove files and folders and explain the silent-overwrite, rm -r and cp -r behaviours that destroy data",
  "Handle file names with spaces or a leading dash safely using quoting, ./ and --",
  "View and measure files with cat, head, tail, wc, sed -n and cat -A, and follow a log with tail -f",
  "Explain rwx permissions, chmod symbolic and numeric forms, the umask, and why a script needs the execute bit",
  "Explain PATH, export, per-command variables and why aliases do not belong in scripts",
  "Use redirection and pipes correctly, including the 2>&1 order and the sort f > f trap, and chain commands with ; && || without mistaking a && b || c for if/else",
  "Start, find, stop and wait for background processes and read the statuses 143, 137, 124, 126 and 127",
  "Find files and text with find, grep and xargs -0, and read grep's exit status",
  "Write a bash script with arguments, a loop, a condition and an exit status, name bash in the shebang, run it and check or trace it with bash -n and bash -x",
]
prerequisites = ["foundations.troubleshooting-method"]
windows_features = []
privilege = "standard"
certifications = ["redhat-rhcsa/essential-tools", "comptia-linux-plus/system-management", "comptia-linux-plus/scripting-containers-automation"]
evaluation_criteria = [
  "Learner writes a script that prints a count per file from a folder of logs",
  "Learner explains the difference between single, double and no quotes in a given example",
  "Learner removes files named -rf.txt and my file.txt safely and shows what the dangerous commands would have done using echo",
  "Learner demonstrates the 2>&1 order difference and the sort f > f trap on a copy",
  "Learner finds and stops a background process and reads the statuses",
  "Learner finds every problem in the exercise-10 script",
]

