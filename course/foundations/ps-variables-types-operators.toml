schema_version = 1
id = "foundations.ps-variables-types-operators"
title = "PowerShell variables, types, strings and operators"
summary = "Variables and scope, automatic and preference variables, .NET types and numeric traps, quoting and interpolation, here-strings and -f formatting, comparison and logical operators, truthiness and $null, arrays, hashtables and custom objects, dates, and what is PowerShell 7 only."
content = "ps-variables-types-operators.md"
estimated_minutes = 130
level = 2
objectives = [
  "Create typed, read-only and scoped variables, and name the important automatic and preference variables",
  "Identify the type of a value and convert between types, including the rounding and overflow behaviour of numbers",
  "Choose single or double quotes, interpolate properties with $( ), and avoid the drive-qualifier trap",
  "Format output with -f, and split, join, replace and match strings with regular expressions",
  "Use comparison, logical and bitwise operators, including case sensitivity and the way an array on the left filters",
  "Apply truthiness rules and compare against $null safely",
  "Use arrays and lists, hashtables, and [pscustomobject] records",
  "Work with dates and durations as objects",
  "Name which operators exist only in PowerShell 7 and write code that also runs on 5.1",
]
prerequisites = ["foundations.powershell-basics"]
windows_features = ["Windows PowerShell"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems"]
evaluation_criteria = [
  "Learner explains the output of 1,2,3,2 -eq 2 and rewrites it to return a boolean",
  "Learner fixes an interpolation bug by using a subexpression",
  "Learner explains why [int](2.5) is 2 and chooses the right rounding method",
  "Learner rewrites a PowerShell 7 expression so it runs in Windows PowerShell 5.1",
]

