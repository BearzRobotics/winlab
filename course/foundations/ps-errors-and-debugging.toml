schema_version = 1
id = "foundations.ps-errors-and-debugging"
title = "PowerShell errors, debugging and testing"
summary = "Terminating versus non-terminating errors and why catch misses some, ErrorAction and preference variables, try/catch/finally and the ErrorRecord, throw and Write-Error, native exit codes, output streams, exit codes, StrictMode, debugging, logging, static analysis and Pester testing."
content = "ps-errors-and-debugging.md"
estimated_minutes = 140
level = 3
objectives = [
  "Explain terminating and non-terminating errors, and why try/catch misses the second kind",
  "Use -ErrorAction and $ErrorActionPreference, and state the difference between SilentlyContinue and Ignore",
  "Write try, catch (typed and general) and finally blocks and read the ErrorRecord in $_",
  "Collect errors with -ErrorVariable and report them together",
  "Choose between throw and Write-Error, and make a function honour the caller's -ErrorAction",
  "Detect native program failure with $LASTEXITCODE and $?, and use PowerShell 7.3+ native error preference",
  "Use the six output streams and redirections appropriately",
  "Give a script meaningful exit codes, and use Set-StrictMode and idempotent design defensively",
  "Debug with trace, breakpoints, verbose output, transcripts and timing, and write a log function",
  "Check an unknown script with PSScriptAnalyzer and a safe reading routine, and write Pester tests",
]
prerequisites = ["foundations.ps-functions-and-scripts"]
windows_features = ["Windows PowerShell"]
privilege = "standard"
certifications = ["comptia-a-core2/operating-systems", "comptia-a-core2/software-troubleshooting"]
evaluation_criteria = [
  "Learner finds, by reading, why a catch block never runs and fixes it",
  "Learner writes a script that processes a list, collects failures, and exits non-zero with a summary",
  "Learner checks a native program's failure and handles it on both 5.1 and 7",
  "Learner reads an unknown script for risky constructs before running it",
]

