  "Describe professional communication with users and when to escalate",
  "Test a restore by comparing paths and file hashes",
]
prerequisites = ["foundations.troubleshooting-method"]
windows_features = []
privilege = "standard"
certifications = ["comptia-a-core2/operational-procedures", "comptia-network-plus/network-operations"]
evaluation_criteria = [
  "Learner turns a lab fix into a problem record another technician could follow",
  "Learner writes a back-out plan for a given change",
]

