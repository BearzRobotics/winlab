<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="A timeline: the last good backup, then a failure, then service restored. The gap before the failure is data lost, limited by the RPO; the gap after is downtime, limited by the RTO" font-family="Segoe UI, sans-serif">
  <title>RPO looks backwards from the failure, RTO looks forwards</title>
  <style>
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text class="bold" x="110" y="30" text-anchor="middle">last good backup</text>
  <text class="bold" x="360" y="30" text-anchor="middle">failure</text>
  <text class="bold" x="610" y="30" text-anchor="middle">service back</text>
  <line class="wire" x1="110" y1="40" x2="110" y2="70" marker-end="url(#arrow)"/>
  <line class="wire" x1="360" y1="40" x2="360" y2="70" marker-end="url(#arrow)"/>
  <line class="wire" x1="610" y1="40" x2="610" y2="70" marker-end="url(#arrow)"/>
  <line class="wire" x1="30" y1="74" x2="690" y2="74" marker-end="url(#arrow)"/>

  <rect class="zone-kernel" x="112" y="90" width="246" height="46" rx="5"/>
  <text x="235" y="118" text-anchor="middle">work that is lost</text>
  <rect class="zone-user" x="362" y="90" width="246" height="46" rx="5"/>
  <text x="485" y="118" text-anchor="middle">time without service</text>

  <text class="bold" x="235" y="162" text-anchor="middle">RPO: the most you may lose</text>
  <text class="bold" x="485" y="162" text-anchor="middle">RTO: the longest it may take</text>
  <text class="dim" x="30" y="192" font-size="13">The business chooses both numbers; the backup design has to meet them.</text>
</svg>
