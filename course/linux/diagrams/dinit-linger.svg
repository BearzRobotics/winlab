<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="At login turnstile starts a dinit instance for the user. After the last logout, without a linger file the user's dinit, services and runtime folder are removed; with the file they keep running" font-family="Segoe UI, sans-serif">
  <title>What happens to user services at logout</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="70" width="140" height="56" rx="6"/>
  <text class="bold" x="80" y="104" text-anchor="middle">login</text>
  <line class="wire" x1="150" y1="98" x2="196" y2="98" marker-end="url(#arrow)"/>
  <rect class="zone-user" x="198" y="70" width="200" height="56" rx="6"/>
  <text class="bold" x="298" y="94" text-anchor="middle">turnstile starts</text>
  <text x="298" y="114" text-anchor="middle" font-size="13">dinit --user for you</text>
  <line class="wire" x1="398" y1="84" x2="468" y2="46" marker-end="url(#arrow)"/>
  <line class="wire" x1="398" y1="112" x2="468" y2="152" marker-end="url(#arrow)"/>
  <text x="418" y="48" text-anchor="middle" font-size="13">last</text>
  <text x="418" y="64" text-anchor="middle" font-size="13">logout</text>

  <rect class="zone-kernel" x="470" y="20" width="240" height="60" rx="6"/>
  <text class="bold" x="590" y="44" text-anchor="middle">no linger file</text>
  <text x="590" y="66" text-anchor="middle" font-size="13">all gone within 3 seconds</text>
  <rect class="zone-user" x="470" y="130" width="240" height="60" rx="6"/>
  <text class="bold" x="590" y="154" text-anchor="middle">linger file for you</text>
  <text x="590" y="176" text-anchor="middle" font-size="13">everything keeps running</text>

  <text class="dim" x="10" y="218" font-size="13">The linger file is in /var/lib/turnstiled/linger/, named for the user. As tested over SSH.</text>
</svg>
