<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="An image from a registry is used to create containers; each container adds its own writable layer, which is deleted with the container; volumes live outside; all containers share the host kernel" font-family="Segoe UI, sans-serif">
  <title>Registry, image, container and volume</title>
  <style>
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.5 }
    .zone-user { fill: #eaf2ff; stroke: #3b7dd8; stroke-width: 1.5 }
    .zone-kernel { fill: #fff1e0; stroke: #c9731c; stroke-width: 1.5 }
    .wire { stroke: #57606a; stroke-width: 1.5 }
    text { fill: #1f2328; stroke: none }
    .bold { font-weight: bold }
    .dim { fill: #57606a }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="50" width="150" height="60" rx="8"/>
  <text class="bold" x="85" y="76" text-anchor="middle">registry</text>
  <text x="85" y="98" text-anchor="middle" font-size="13">a server of images</text>
  <line class="wire" x1="160" y1="80" x2="216" y2="80" marker-end="url(#arrow)"/>
  <text x="188" y="70" text-anchor="middle" font-size="13">pull</text>
  <rect class="zone-user" x="218" y="50" width="160" height="60" rx="8"/>
  <text class="bold" x="298" y="76" text-anchor="middle">image</text>
  <text x="298" y="98" text-anchor="middle" font-size="13">read-only files</text>
  <line class="wire" x1="378" y1="80" x2="434" y2="80" marker-end="url(#arrow)"/>
  <text x="406" y="70" text-anchor="middle" font-size="13">run</text>

  <rect class="zone-kernel" x="436" y="30" width="274" height="120" rx="8"/>
  <text class="bold" x="573" y="56" text-anchor="middle">container</text>
  <rect class="box" x="456" y="68" width="234" height="32" rx="5"/>
  <text x="573" y="89" text-anchor="middle" font-size="13">its writes (gone when removed)</text>
  <rect class="box" x="456" y="108" width="234" height="32" rx="5"/>
  <text x="573" y="129" text-anchor="middle" font-size="13">process(es), isolated and limited</text>

  <line class="wire" x1="573" y1="150" x2="573" y2="182" marker-end="url(#arrow)"/>
  <text x="590" y="172" font-size="13">-v</text>
  <rect class="zone-user" x="436" y="184" width="274" height="48" rx="8"/>
  <text x="573" y="214" text-anchor="middle">volume or host folder: kept</text>

  <rect class="box" x="10" y="248" width="700" height="40" rx="8"/>
  <text class="bold" x="360" y="274" text-anchor="middle">one Linux kernel, shared by the host and every container</text>
</svg>
