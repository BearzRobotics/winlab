schema_version = 1
id = "linux.storage-filesystems"
title = "Linux storage: block devices, file systems and mounts"
summary = "See the storage on a Linux server, mount and unmount file systems, and make mounts persistent with /etc/fstab."
content = "storage-filesystems.md"
estimated_minutes = 100
level = 3
objectives = [
  "List block devices, file systems and mounts with lsblk, blkid, df and findmnt",
  "Mount and unmount a file system and explain why a manual mount does not survive a restart",
  "Read and write an /etc/fstab line, and test it with mount -a",
  "Recognise the symptom of a volume that is not mounted",
  "Work out why a file system is full: usage, deleted open files and inodes",
  "Grow an LVM logical volume together with its file system",
]
prerequisites = ["foundations.bash-basics"]
windows_features = []
privilege = "administrator"
certifications = ["redhat-rhcsa/local-storage", "redhat-rhcsa/file-systems", "comptia-linux-plus/system-management"]
evaluation_criteria = [
  "Learner mounts a file system and makes the mount persistent, then proves it with mount -a",
  "Learner explains why UUIDs are preferred in fstab",
]

