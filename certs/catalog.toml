schema_version = 1

# Certifications WinLab's material is mapped to. Only domain TITLES are listed, as the vendors publish them;
# the objective wording is not copied. The `url` is the vendor's page for the current objectives, which is
# the authority (exams are revised, so check it). A tag on a lesson or lab means "supports this domain",
# never "passes this exam". Verify each entry against the vendor's current outline before relying on it.
#
# Checked 2026-11-22 against the vendors' own pages (read by script, not by eye): Network+ N10-009 (five domain titles match), MD-102
# (updated: the fourth domain is now "Manage and secure applications"), Red Hat RHCSA EX200 (the eight listed objective groups match),
# Linux+ (updated to V8, XK0-006: five domains, one added, one renamed). NOT checked: A+ Core 1 and Core 2 (the page is rendered by
# script and gave no domain names); check 220-1201 and 220-1202 by hand.

