[[question]]
id = "tp-awk"
type = "choice"
prompt = "Why does the template pass values to awk with -v key=... and not inside the program text?"
choices = ["So the data cannot become code (injection)", "-v is faster", "awk needs it", "To save a variable"]
answers = ["So the data cannot become code (injection)"]
explanation = "The text-processing lesson reproduced the injection."
review = "A robust script template, tested"

[[question]]
id = "tp-harness"
type = "choice"
prompt = "Why does the lesson's harness include a deliberately wrong test?"
choices = ["A suite that has never failed has not been shown to work", "To annoy the learner", "bash requires one failure", "To test ShellCheck"]
answers = ["A suite that has never failed has not been shown to work"]
explanation = "It printed FAIL and 7 passed, 1 failed, as intended."
review = "A test harness in fifteen lines"
