schema_version = 1
lesson = "linux.storage-filesystems"
# Draft for owner review. Every answer comes from the lesson text.
draw = 10

[[question]]
id = "lsblk-f"
type = "choice"
prompt = "Which command shows disks as a tree with file system type, label and UUID?"
choices = ["lsblk -f", "df -hT", "findmnt", "mkfs.xfs"]
answers = ["lsblk -f"]
explanation = "df -hT shows mounted file systems with size, used, free and type."
review = "Seeing the storage"

[[question]]
id = "df-ht"
type = "choice"
prompt = "Which command shows mounted file systems with size, used, free and type?"
choices = ["df -hT", "lsblk", "blkid", "umount"]
answers = ["df -hT"]
explanation = "blkid prints the type and UUID of each block device."
review = "Seeing the storage"

[[question]]
id = "block-device"
type = "multi"
prompt = "Which count as a block device, according to the lesson?"
choices = ["A real disk such as /dev/sda", "A partition such as /dev/sda1", "A logical volume", "A file attached through a loop device", "A plain text file in /home"]
answers = ["A real disk such as /dev/sda", "A partition such as /dev/sda1", "A logical volume", "A file attached through a loop device"]
explanation = "Anything the kernel treats as a disk."
review = "Seeing the storage"

[[question]]
id = "mount-point"
type = "choice"
prompt = "What is a mount point?"
choices = ["The folder where a file system's structure appears", "The device name of a disk", "A file system type", "A partition table"]
answers = ["The folder where a file system's structure appears"]
explanation = "A file system (ext4, xfs) is the structure written onto the device."
review = "Seeing the storage"

[[question]]
id = "findmnt-check"
type = "choice"
prompt = "Which command tells you whether /srv/data is mounted, and from what?"
choices = ["findmnt /srv/data", "blkid /srv/data", "mkfs /srv/data", "lsblk /srv/data -x"]
answers = ["findmnt /srv/data"]
explanation = "findmnt with no argument shows everything mounted, as a tree."
review = "Seeing the storage"

[[question]]
id = "manual-mount-persist"
type = "choice"
prompt = "A mount made with the mount command by hand survives a restart:"
choices = ["No: it is gone after a restart unless it is in /etc/fstab", "Yes, always", "Only on xfs", "Only as root"]
answers = ["No: it is gone after a restart unless it is in /etc/fstab"]
explanation = "Make it persistent with an fstab line."
review = "Mounting by hand"

[[question]]
id = "target-busy"
type = "choice"
prompt = "umount says 'target is busy'. What shows who is using it?"
choices = ["fuser -vm /srv/data (or lsof, if installed)", "mkfs and blkid", "df and lsblk", "mount -a and daemon-reload"]
answers = ["fuser -vm /srv/data (or lsof, if installed)"]
explanation = "Something is using the mount; find it before detaching."
review = "Mounting by hand"

[[question]]
id = "fstab-fields"
type = "short"
prompt = "How many fields does each line of /etc/fstab have? Number only."
answers = ["6", "six"]
explanation = "Device, mount point, type, options, dump, fsck order."
review = "Making a mount persistent: /etc/fstab"

[[question]]
id = "fstab-sixth"
type = "choice"
prompt = "What does the sixth field of an fstab line control?"
choices = ["The order of file system checks (fsck order)", "The mount options", "The dump frequency", "The device name"]
answers = ["The order of file system checks (fsck order)"]
explanation = "The fifth is dump; the fourth is options."
review = "Making a mount persistent: /etc/fstab"

[[question]]
id = "uuid-safer"
type = "choice"
prompt = "Why is UUID= safer than /dev/sdb1 in fstab?"
choices = ["Device names can change between boots", "UUIDs are shorter", "UUIDs are faster", "/dev/sdb1 is not allowed"]
answers = ["Device names can change between boots"]
explanation = "Prefer a UUID or label."
review = "Making a mount persistent: /etc/fstab"

[[question]]
id = "mount-a"
type = "choice"
prompt = "Why run mount -a after editing fstab?"
choices = ["It is also your test: a broken line shows as an error now instead of at boot", "It formats the disk", "It deletes old mounts", "It checks the network"]
answers = ["It is also your test: a broken line shows as an error now instead of at boot"]
explanation = "Found at boot, a broken line can drop the machine into emergency mode."
review = "Making a mount persistent: /etc/fstab"

[[question]]
id = "nofail"
type = "short"
prompt = "Which fstab option stops a missing non-essential disk from halting the boot? Type the option."
answers = ["nofail"]
explanation = "Add it to non-essential volumes."
review = "Making a mount persistent: /etc/fstab"

[[question]]
id = "mkfs-destroys"
type = "choice"
prompt = "What does mkfs.xfs do to a device that already holds data?"
choices = ["It destroys what was on it, so check the device name twice with lsblk", "It keeps the data and adds a label", "It mounts it", "It only checks it"]
answers = ["It destroys what was on it, so check the device name twice with lsblk"]
explanation = "Never practise it on anything but the lab VM."
review = "Creating a file system"

[[question]]
id = "wrong-disk"
type = "multi"
prompt = "Which evidence shows 'the files are on the wrong disk' (the mount did not happen)?"
choices = ["findmnt shows nothing at the mount point", "df shows the root volume filling", "The files are fine and complete", "lsblk shows a new disk"]
answers = ["findmnt shows nothing at the mount point", "df shows the root volume filling"]
explanation = "Writes went to the folder on the root file system underneath."
review = "The problem pattern"

[[question]]
id = "wrong-disk-fix"
type = "choice"
prompt = "What is the right way to treat files written to the folder underneath, once you have mounted the volume?"
choices = ["Make a deliberate decision, not a guess", "Delete them at once", "Ignore them", "Reformat the disk"]
answers = ["Make a deliberate decision, not a guess"]
explanation = "The fix is to mount it and make the fstab entry correct."
review = "The problem pattern"

# ---- Added when the lesson was deepened ----

[[question]]
id = "df-not-mounted"
type = "choice"
prompt = "Nothing is mounted at /mnt/wl. What does df -h /mnt/wl show?"
choices = ["The file system that holds the folder, such as the root file system", "An error saying nothing is mounted", "An empty file system of size 0", "Nothing at all"]
answers = ["The file system that holds the folder, such as the root file system"]
explanation = "Test for a mount with findmnt or mountpoint."
review = "`df` and `findmnt`"

[[question]]
id = "deleted-open"
type = "choice"
prompt = "A log was deleted but df shows no space freed, and du cannot account for the usage. What is the likely cause?"
choices = ["A process still has the deleted file open", "The disk is broken", "df is cached for a day", "The file was not really deleted by root"]
answers = ["A process still has the deleted file open"]
explanation = "The space is freed when the last handle closes, usually by restarting the service."
review = "2. A deleted file that is still open"

[[question]]
id = "inodes"
type = "choice"
prompt = "Creating files fails with 'No space left on device' while df -h shows 1% used. Which command shows the cause?"
choices = ["df -i", "du -sh", "lsblk -f", "blkid"]
answers = ["df -i"]
explanation = "The file system has run out of inodes."
review = "3. Out of inodes"

[[question]]
id = "nofail-silent"
type = "choice"
prompt = "An fstab line with nofail has a wrong UUID. What did mount -a do in the lesson?"
choices = ["Printed nothing, exited 0 and mounted nothing", "Printed an error and exited 32", "Mounted a different disk", "Stopped the system"]
answers = ["Printed nothing, exited 0 and mounted nothing"]
explanation = "Prove a mount with findmnt."
review = "What the mistakes look like"

[[question]]
id = "mkfs-script"
type = "choice"
prompt = "In the lesson, mkfs.ext4 ran on a device that already held ext4, with input from /dev/null. What happened?"
choices = ["It overwrote the file system without asking", "It refused and required -f", "It kept the old files", "It mounted the old file system"]
answers = ["It overwrote the file system without asking"]
explanation = "Check the device yourself; mkfs.xfs refused in the same situation."
review = "Creating a file system"

[[question]]
id = "vfree"
type = "choice"
prompt = "Which output tells you whether a volume group has unused space for growing a logical volume?"
choices = ["VFree in vgs", "Use% in df", "RM in lsblk", "UUID in blkid"]
answers = ["VFree in vgs"]
explanation = "vgs describes the pool."
review = "LVM: volumes you can grow"

[[question]]
id = "lvextend-r"
type = "choice"
prompt = "You run lvextend without -r. What is the result?"
choices = ["The volume grows, but the file system does not until it is grown too", "The files are deleted", "The command always fails", "Both grow anyway"]
answers = ["The volume grows, but the file system does not until it is grown too"]
explanation = "-r grows the file system in the same step."
review = "LVM: volumes you can grow"
