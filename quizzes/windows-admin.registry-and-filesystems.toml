schema_version = 1
lesson = "windows-admin.registry-and-filesystems"
# Draft for owner review. Every answer comes from the lesson text. A bank of 30.
draw = 10

[[question]]
id = "hklm-vs-hkcu"
type = "choice"
prompt = "What does an HKCU value apply to, and what does an HKLM value apply to?"
choices = ["HKCU: the signed-in user; HKLM: the whole machine", "HKCU: the whole machine; HKLM: the signed-in user", "Both: the whole machine", "Both: the signed-in user"]
answers = ["HKCU: the signed-in user; HKLM: the whole machine"]
explanation = "HKCU is loaded from the user's NTUSER.DAT."
review = "The registry"

[[question]]
id = "hive-holds"
type = "choice"
prompt = "Which hive holds services, drivers, installed software and policy for the whole machine?"
choices = ["HKLM", "HKCU", "HKCR", "HKCC"]
answers = ["HKLM"]
explanation = "HKCR is a merged view of file associations and COM."
review = "The registry"

[[question]]
id = "value-types"
type = "multi"
prompt = "Which are registry value types listed in the lesson?"
choices = ["REG_SZ (text)", "REG_DWORD (number)", "REG_MULTI_SZ (list)", "REG_BINARY", "REG_VIDEO"]
answers = ["REG_SZ (text)", "REG_DWORD (number)", "REG_MULTI_SZ (list)", "REG_BINARY"]
explanation = "A key holds values with a name, a type and data."
review = "The registry"

[[question]]
id = "export-before"
type = "choice"
prompt = "Why export a registry key before editing it?"
choices = ["So you can restore it with reg import if the change makes things worse", "To make the edit faster", "Windows requires it", "To clear the policy"]
answers = ["So you can restore it with reg import if the change makes things worse"]
explanation = "Safe practice: export the key, change one value, test, and record it."
review = "The registry"

[[question]]
id = "reg-export-cmd"
type = "choice"
prompt = "Which command exports a key to a file?"
choices = ["reg export \"HKLM\\SOFTWARE\\Contoso\" backup.reg", "reg import backup.reg", "Remove-ItemProperty", "New-ItemProperty"]
answers = ["reg export \"HKLM\\SOFTWARE\\Contoso\" backup.reg"]
explanation = "reg import restores it."
review = "The registry"

[[question]]
id = "third-party-cleaners"
type = "choice"
prompt = "What does the lesson say about third-party registry 'cleaners'?"
choices = ["Do not use them", "Use them weekly", "They are required", "They make backups"]
answers = ["Do not use them"]
explanation = "Do not 'clean' the registry with third-party tools."
review = "The registry"

[[question]]
id = "policy-signal"
type = "choice"
prompt = "What does a value under a ...\\Policies key suggest?"
choices = ["Something set it deliberately", "It is a default", "It is corrupt", "It is for hardware"]
answers = ["Something set it deliberately"]
explanation = "Policy values are a signal."
review = "The registry"

[[question]]
id = "startup-places"
type = "multi"
prompt = "Which are places a program can start with Windows?"
choices = ["Services", "Scheduled tasks", "The Run keys", "The Startup folders", "The wallpaper"]
answers = ["Services", "Scheduled tasks", "The Run keys", "The Startup folders"]
explanation = "Get-CimInstance Win32_StartupCommand lists many of them."
review = "Startup locations"

[[question]]
id = "startup-cmd"
type = "short"
prompt = "Which built-in WMI class does Get-CimInstance query to list many startup commands? Type the class name."
answers = ["win32_startupcommand"]
explanation = "Get-CimInstance Win32_StartupCommand."
review = "Startup locations"

[[question]]
id = "ntfs-features"
type = "multi"
prompt = "Which does NTFS provide?"
choices = ["Permissions", "Compression", "Encryption (EFS)", "Journaling", "A 4 GB file size limit"]
answers = ["Permissions", "Compression", "Encryption (EFS)", "Journaling"]
explanation = "The 4 GB limit and no permissions describe FAT32."
review = "File systems"

[[question]]
id = "fat32-limit"
type = "short"
prompt = "What is FAT32's maximum file size, in GB? Number only."
answers = ["4"]
explanation = "FAT32 has a 4 GB file-size limit and no permissions."
review = "File systems"

[[question]]
id = "refs"
type = "choice"
prompt = "What does ReFS add?"
choices = ["Resilience for storage workloads", "Removable-media simplicity", "A 4 GB limit", "Nothing"]
answers = ["Resilience for storage workloads"]
explanation = "FAT32 and exFAT are the simple formats for removable media."
review = "File systems"

[[question]]
id = "chkdsk-readonly"
type = "choice"
prompt = "Does plain chkdsk C: (no switches) change the disk?"
choices = ["No, it is a read-only check", "Yes, it repairs errors", "Yes, it formats", "Yes, it compresses"]
answers = ["No, it is a read-only check"]
explanation = "The lesson marks it read-only."
review = "File systems"

[[question]]
id = "full-drive"
type = "choice"
prompt = "A machine behaves strangely and C: has 200 MB free. What do you suspect?"
choices = ["The full system drive: it affects updates, paging and logs and causes odd, unrelated-looking failures", "A bad monitor", "A weak password", "A broken keyboard"]
answers = ["The full system drive: it affects updates, paging and logs and causes odd, unrelated-looking failures"]
explanation = "Find what is large before deleting anything."
review = "File systems"

[[question]]
id = "mklink"
type = "choice"
prompt = "Which command makes a symbolic link to a folder?"
choices = ["mklink /D C:\\Link C:\\Target", "attrib +h", "chkdsk C:", "fsutil volume diskfree C:"]
answers = ["mklink /D C:\\Link C:\\Target"]
explanation = "A junction or symbolic link makes one folder appear at another path."
review = "Paths, links and attributes"

[[question]]
id = "hidden-not-protected"
type = "choice"
prompt = "Do the hidden and system attributes protect a file?"
choices = ["No, they hide files without protecting them", "Yes, completely", "Only on FAT32", "Only for administrators"]
answers = ["No, they hide files without protecting them"]
explanation = "Use permissions to protect."
review = "Paths, links and attributes"

# ---- Added with the expanded lesson ----

[[question]]
id = "productname-trap"
type = "choice"
prompt = "A Windows 11 PC's ProductName registry value says 'Windows 10 Home'. What does that show?"
choices = ["A value is only what was written there; check the build number instead", "The PC is really running Windows 10", "The registry is corrupt and must be restored", "ProductName is a policy value"]
answers = ["A value is only what was written there; check the build number instead"]
explanation = "The lesson's test PC reported exactly this with build 26300."
review = "Reading without changing anything"

[[question]]
id = "expand-sz"
type = "choice"
prompt = "Two values both hold %TEMP%\\logs. Get-ItemProperty shows one filled in and one with percent signs. Why?"
choices = ["The first is REG_EXPAND_SZ and the second REG_SZ", "The second is broken", "PowerShell expands only the first value it reads", "One of them is in HKLM"]
answers = ["The first is REG_EXPAND_SZ and the second REG_SZ"]
explanation = "Only the expandable type has its variables filled in on reading."
review = "Reading without changing anything"

[[question]]
id = "dword-hex"
type = "short"
prompt = "reg query shows a REG_DWORD as 0x10. What is that in decimal? (number only)"
answers = ["16"]
explanation = "reg query prints DWORD values in hexadecimal."
review = "Reading without changing anything"

[[question]]
id = "ps-lines"
type = "choice"
prompt = "Get-ItemProperty shows PSPath, PSChildName and PSDrive. What are they?"
choices = ["Extra properties added by PowerShell, not registry values", "Hidden registry values", "Policy values", "Values in WOW6432Node"]
answers = ["Extra properties added by PowerShell, not registry values"]
explanation = "They appear on every result."
review = "Reading without changing anything"

[[question]]
id = "type-change"
type = "choice"
prompt = "A DWord value is changed with Set-ItemProperty ... -Value 'five'. What happens?"
choices = ["It silently becomes a String", "An error stops the change", "It stays a DWord with the value 0", "The key is deleted"]
answers = ["It silently becomes a String"]
explanation = "State the type with -Type when it matters, and check the kind afterwards."
review = "Changing values, and three traps"

[[question]]
id = "newitem-force"
type = "choice"
prompt = "What did New-Item -Force do to a key that already had a value and a subkey?"
choices = ["Left an empty key: the value and subkey were gone", "Left it unchanged", "Made a backup first", "Added a second key beside it"]
answers = ["Left an empty key: the value and subkey were gone"]
explanation = "Create the key only if Test-Path says it is missing."
review = "Changing values, and three traps"

[[question]]
id = "import-merge"
type = "choice"
prompt = "After exporting a key you added a value, then imported the export. What happened to the added value?"
choices = ["It stayed: import adds and overwrites but does not remove", "It was removed", "It was set to zero", "The import failed"]
answers = ["It stayed: import adds and overwrites but does not remove"]
explanation = "Delete what you added yourself."
review = "Back up first: export and import"

[[question]]
id = "startup-misses"
type = "choice"
prompt = "Win32_StartupCommand lists nothing suspicious. What should you conclude?"
choices = ["Little yet: it did not list scheduled tasks or services, so check those too", "Nothing starts automatically", "The program is malware", "The registry is empty"]
answers = ["Little yet: it did not list scheduled tasks or services, so check those too"]
explanation = "On the test PC it listed 3 entries while 41 tasks had a boot or sign-in trigger."
review = "Startup locations"

[[question]]
id = "runonce"
type = "choice"
prompt = "By default, when is a RunOnce value deleted?"
choices = ["Before its command runs", "After its command succeeds", "At the next restart", "Never"]
answers = ["Before its command runs"]
explanation = "So a command that fails is not tried again."
review = "Startup locations"

[[question]]
id = "no-letter"
type = "choice"
prompt = "A disk has several partitions with no drive letter. What is the right action?"
choices = ["Leave them: boot and recovery partitions normally have none", "Delete them to free space", "Format them as FAT32", "Give them all letters"]
answers = ["Leave them: boot and recovery partitions normally have none"]
explanation = "Deleting them can stop Windows booting or recovering."
review = "Looking at disks and volumes"

[[question]]
id = "sum-sizes"
type = "choice"
prompt = "Per-folder sizes on C: add up to far more than the volume reports as used. Why can this happen?"
choices = ["Summed file lengths are not space used: for example, hard links count the same data once per name", "The volume is always wrong", "Hidden files are counted twice by Windows", "FAT32 doubles file sizes"]
answers = ["Summed file lengths are not space used: for example, hard links count the same data once per name"]
explanation = "Trust the volume for used and free space; use folder totals to decide where to look."
review = "Finding what fills a disk"

[[question]]
id = "silent-errors"
type = "choice"
prompt = "A size script uses -ErrorAction SilentlyContinue. What should it also do?"
choices = ["Count the errors, so the reader knows what was not measured", "Nothing: the total is exact", "Delete the unreadable files", "Run faster"]
answers = ["Count the errors, so the reader knows what was not measured"]
explanation = "Even an administrator could not read everything in the test."
review = "Finding what fills a disk"

[[question]]
id = "hardlink-edit"
type = "choice"
prompt = "A file has a second name made with mklink /H. You edit it through the new name. What does the old name show?"
choices = ["The new contents: both names are the same file", "The old contents", "An error", "An empty file"]
answers = ["The new contents: both names are the same file"]
explanation = "A hard link is a second name for the same data."
review = "Junctions, symbolic links and hard links"

[[question]]
id = "remove-link"
type = "choice"
prompt = "Which removes a junction while leaving the folder it points to, as tested in the lesson?"
choices = ["rmdir on the link", "del /s on the link", "format", "attrib -h"]
answers = ["rmdir on the link"]
explanation = "Use rmdir without /S on the link itself."
review = "Junctions, symbolic links and hard links"
