schema_version = 1
id = "linux-admin"
title = "Linux administrator"
goal = "Work confidently on Ubuntu and AlmaLinux: shell, storage, containers, networking and basic security."
audience = "The RHCSA and Linux+ style of skills. More lessons (users, packages) are planned."
order = 50
certifications = ["comptia-a-core2/operating-systems"]

[[stage]]
title = "Method and shell"
lessons = ["foundations.architecture", "foundations.troubleshooting-method", "foundations.bash-basics", "foundations.shells-and-posix", "foundations.bash-variables-and-expansion", "foundations.bash-control-flow", "foundations.bash-functions-and-scripts", "foundations.bash-text-processing", "foundations.bash-robust-scripts", "foundations.bash-advanced"]
labs = ["labs.linux-service-disabled", "labs.linux-wrong-time-zone", "labs.linux-cron-file-ignored", "labs.alma-crond-disabled", "labs.alma-dnf-repo-disabled", "labs.alma-journal-volatile", "labs.alma-service-config-error"]

[[stage]]
title = "Services and the journal"
lessons = ["linux.systemd", "linux.systemd-advanced"]
labs = []

[[stage]]
title = "dinit and Chimera"
lessons = ["linux.dinit-basics", "linux.dinit-service-files", "linux.dinit-in-practice", "linux.init-systems-compared"]
labs = ["labs.chimera-no-system-log", "labs.chimera-service-wont-start", "labs.chimera-user-not-admin", "labs.chimera-apk-repo-typo"]

[[stage]]
title = "Storage and containers"
lessons = ["linux.storage-filesystems", "linux.containers-podman"]
labs = ["labs.alma-fstab-mount-missing", "labs.alma-lvm-extend", "labs.alma-container-service-fails"]

[[stage]]
title = "Networking"
lessons = ["networking.addressing-and-names", "networking.dns", "networking.ports-and-firewalls"]
labs = ["labs.linux-name-resolution", "labs.linux-service-loopback-only"]

[[stage]]
title = "Security"
lessons = ["security.security-fundamentals"]
labs = ["labs.alma-firewalld-http", "labs.alma-selinux-context", "labs.alma-ssh-root-login", "labs.alma-sudo-access-lost", "labs.linux-account-locked", "labs.linux-file-permissions"]
