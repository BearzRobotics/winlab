schema_version = 1
id = "cybersecurity"
title = "Cybersecurity: defend and investigate your own lab"
goal = "Work the defender's loop on your own machines: get permission and write the scope, model the threats, see what is exposed, harden and check, detect what happens, and respond without destroying evidence. Defensive first, own lab only."
audience = "Someone who has finished the security fundamentals and can use a Linux shell. Windows is covered by two lessons (event logging, and a hardening baseline), tested on Windows Server 2022 only; a vulnerability-management lesson is planned, not yet written."
order = 72
certifications = ["comptia-linux-plus/security"]

[[stage]]
title = "Foundations this track assumes"
lessons = ["foundations.architecture", "foundations.troubleshooting-method", "foundations.bash-basics", "foundations.powershell-basics", "networking.addressing-and-names", "networking.ports-and-firewalls", "linux.systemd"]
labs = []

[[stage]]
title = "Permission and planning"
lessons = ["security.security-fundamentals", "security.authorization-and-scope", "security.threat-modelling"]
labs = []

[[stage]]
title = "See what is there and what happens"
lessons = ["security.own-lab-recon", "security.linux-logging-and-detection", "security.windows-logging-and-detection"]
labs = []

[[stage]]
title = "Harden and check"
lessons = ["security.linux-hardening-checks", "security.windows-hardening-checks"]
labs = ["labs.linux-sshd-dropin-order"]

[[stage]]
title = "Respond"
lessons = ["security.incident-response-linux"]
labs = ["labs.linux-rogue-service"]
