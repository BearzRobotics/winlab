name: Lab problem
description: A scenario that cannot be fixed or broken, or whose check is wrong
labels: [lab]
body:
  - type: input
    id: lab
    attributes:
      label: Lab file
      description: The file name in labs/, for example linux-file-permissions.toml
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and guest
      description: For example Windows 11 host with the Ubuntu lab VM; or Fedora host, hardware acceleration yes/no
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which step failed and what the app showed.
    validations:
      required: true
