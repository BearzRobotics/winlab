name: Release
# Push a tag such as v0.1.0-beta.1 to build the Windows installer, the Windows portable zip and the Linux tarball,
# and attach them (with SHA256SUMS) to a pre-release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build installer and portable zip
        shell: pwsh
        run: powershell -NoProfile -File installer\build-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/WinLab-*-x64.exe
            dist/WinLab-*-portable.zip
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Build and package
        run: |
          set -eu
          version=$(sed -n 's/.*app_version = "\(.*\)".*/\1/p' src/app/version.zig)
          # glibc 2.31 floor: runs on Debian 11+, Ubuntu 20.04+, RHEL 9+ and newer. SDL3 is linked in statically.
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu.2.31 -Dcpu=x86_64_v2 --prefix build
          name="WinLab-${version}-linux-x86_64"
          mkdir -p "dist/$name/images" "dist/$name/docs"
          cp build/bin/winlab "dist/$name/"
          for d in course labs paths quizzes certs; do cp -r "$d" "dist/$name/"; done
          cp images/catalog.toml "dist/$name/images/"
          cp docs/learning-paths.md "dist/$name/docs/"
          cp README.md LICENSE "dist/$name/"
          cp packaging/linux/INSTALL.md packaging/linux/winlab.desktop "dist/$name/"
          echo "$version" > "dist/$name/VERSION.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          "dist/$name/winlab" check "dist/$name/course" | tail -4
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.tar.gz
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --prerelease \
              --title "WinLab ${GITHUB_REF_NAME}" \
              --notes "Beta build. Every lesson is a draft for review. The Windows installer is not code-signed (SmartScreen warns). Linux: unpack the tarball and run ./winlab (see INSTALL.md inside). Verify downloads against SHA256SUMS." \
              *
          fi
